<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sanctuary split</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="css/styles.css">
<style>
  /* 🏛️ Sanctuary split for the NAP (Sherry 2026-11-22). Opened by link only (officer 🗺️ Map → 🎁 rewards card); not in the site menu.
     2026-11-23: redone as a phase-by-phase route, because a held Sanctuary is signed up again automatically and only one more can be added per phase. */
  body { padding: 16px 16px 60px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-family: "Oswald", "Noto Sans TC", sans-serif; margin: 0 0 4px; font-size: 26px; }
  h3 { margin: 0 0 8px; font-size: 17px; }
  .muted { color: var(--text-muted); font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 14px; margin: 14px 0; box-shadow: 0 4px 14px var(--shadow); }
  .top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .top select, .ss-own { padding: 5px 6px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); color: var(--text); font: inherit; font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border: 1px solid var(--rule); border-radius: 999px; background: var(--panel-2); font-size: 13px; cursor: pointer; user-select: none; }
  .chip input { margin: 0; accent-color: var(--accent); }
  .chip.on { border-color: var(--accent); }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .btn2 { padding: 7px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel-2); color: var(--text); font: inherit; font-size: 13px; cursor: pointer; }
  .btn2.on { border-color: var(--accent); color: var(--accent); }
  .tw { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 6px 7px; border-bottom: 1px solid var(--rule); text-align: start; vertical-align: middle; white-space: nowrap; }
  thead th { color: var(--text-muted); font-weight: 600; font-size: 12px; }
  td.num, th.num { text-align: end; font-variant-numeric: tabular-nums; }
  .bar { display: inline-block; width: 74px; height: 8px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--rule); vertical-align: middle; margin-inline-start: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .cal th, .cal td { text-align: center; padding: 5px 4px; }
  .cal td:first-child, .cal th:first-child { text-align: start; position: sticky; inset-inline-start: 0; background: var(--panel); z-index: 1; }
  /* reward icons: cut from the game's own reward screen (Sherry's screenshots 2026-11-22); the amount sits on a strip over the icon's own number */
  .ic { position: relative; display: block; width: 46px; height: 46px; margin: 0 auto 3px; border-radius: 9px; overflow: hidden; background: var(--panel-2); }
  .ic img { display: block; width: 100%; height: 100%; }
  .ic em { position: absolute; inset: auto 0 0 0; padding: 0 4px 1px; font-style: normal; font-size: 11px; font-weight: 700; line-height: 15px; text-align: end; color: #fff; background: rgba(20, 14, 8, .78); font-variant-numeric: tabular-nums; }
  .cell { display: inline-block; min-width: 58px; padding: 4px 3px; border-radius: 9px; border: 1px solid transparent; line-height: 1.25; font-size: 11.5px; color: var(--text-muted); }
  .cell:not(.w) .ic { opacity: .45; filter: grayscale(.6); }
  .cell.w { background: color-mix(in srgb, var(--accent) 16%, transparent); border-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--text); }
  .chip img { width: 22px; height: 22px; border-radius: 5px; display: block; }
  .grp td { background: var(--panel-2); font-weight: 600; text-align: start !important; position: static !important; }
  .now { outline: 2px solid var(--brass); outline-offset: -2px; }
  ul.plain { margin: 6px 0 0; padding-inline-start: 1.2em; display: grid; gap: 5px; font-size: 14px; }
  .two { display: inline-flex; gap: 3px; } .two .cell { min-width: 52px; } .sn { display: block; font-size: 11px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
  .ffa td { background: var(--panel-2); } .ffa td:first-child { background: var(--panel-2); }
  .tag { display: inline-block; font-size: 11.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--rule); color: var(--text-muted); margin-inline-start: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1 id="t_h"></h1><div class="muted" id="t_sub"></div></div>
    <select id="lang" aria-label="Language"><option value="en">English</option><option value="zh">中文</option></select>
  </div>

  <div class="card"><h3 id="t_wantH"></h3><div class="muted" id="t_wantP"></div><div class="chips" id="want"></div></div>

  <div class="card"><h3 id="t_splitH"></h3><div class="muted" id="t_splitP"></div>
    <div class="btns" id="views"></div>
    <div class="tw" style="margin-top:10px"><table id="split"></table></div>
    <div class="muted" id="t_splitN" style="margin-top:8px"></div>
  </div>

  <div class="card"><h3 id="t_calH"></h3><div class="muted" id="t_calP"></div>
    <div class="tw" style="margin-top:10px"><table class="cal" id="cal"></table></div>
  </div>

  <div class="card"><h3 id="t_bufH"></h3><div class="muted" id="t_bufP"></div>
    <div class="tw" style="margin-top:10px"><table class="cal" id="buf"></table></div>
  </div>

  <div class="card" id="movesCard"><h3 id="t_movH"></h3><ul class="plain" id="moves"></ul></div>

  <div class="card"><h3 id="t_fortH"></h3><div class="muted" id="t_fortP"></div>
    <div class="tw" style="margin-top:10px"><table class="cal" id="fort"></table></div>
  </div>

  <div class="card"><h3 id="t_noteH"></h3><ul class="plain" id="notes"></ul></div>
</div>
<script>
(() => {
  "use strict";
  /* Reward of each Sanctuary / Fortress in phases 1–8 of a season (the same table as the officer 🗺️ Map page, js/officer/map.js RW_WIKI):
     Kingshot Wiki table, read off the game screen for phases 3 (2026-10-15), 5 (2026-10-30) and 8 (2026-11-22). */
  const S = { 1: "JS HB SU TP ES HB SU XP", 2: "TP JS HB XP XP ES HB SU", 3: "SU TP JS HB SU XP ES HB", 4: "HB SU TP CB TP SU XP ES", 5: "JS DB SU EM ES DB SU XP", 6: "TP JS DB SU XP ES DB SU",
    7: "SU TP JS TP SU XP ES DB", 8: "DB SU TP XP TP SU XP ES", 9: "JS DP SU DB ES DP SU XP", 10: "TP JS DP CB XP ES DP SU", 11: "SU TP JS EM SU XP ES DP", 12: "DP SU TP SU TP SU XP ES" };
  const F = { 1: "SS EX EM JS SS EX EM JS", 2: "CB SS EX CB CB SS EX CB", 3: "EM CB SS EX EM CB CB EX", 4: "EX EM CB SS EX EM SS SS" };
  for (const k in S) S[k] = S[k].split(" "); for (const k in F) F[k] = F[k].split(" ");
  const ITEM = {
    SU: { i: "gen1h", q: 400, en: "1h speedup", zh: "1 小時加速", full: { en: "1h General Speedup", zh: "1 小時通用加速" } },
    TP: { i: "teleport", q: 90, en: "Teleport", zh: "高級遷城", full: { en: "Advanced Teleporter", zh: "高級遷城" } },
    HB: { i: "hp2", q: 60, en: "Health buff", zh: "生命增益", full: { en: "Troops Health Up II (12hrs)", zh: "部隊生命值提升II（12小時）" } },
    DB: { i: "dmg2", q: 60, en: "Damage buff", zh: "傷害增益", full: { en: "Troops Damage Up II (12hrs)", zh: "部隊傷害提升II（12小時）" } },
    DP: { i: "deploy2", q: 60, en: "Deploy buff", zh: "出征增益", full: { en: "Deployment Capacity Boost II (12hrs)", zh: "出征部隊數量提升II（12小時）" } },
    ES: { i: "epicchest", q: 300, en: "Epic chest", zh: "史詩箱", full: { en: "Custom Epic Hero Shard Chest", zh: "史詩英雄碎片客製化箱子" } },
    XP: { i: "heroxp10k", q: 300, en: "Hero XP", zh: "英雄經驗", full: { en: "10,000 Hero XP", zh: "10,000點英雄經驗值" } },
    JS: { i: "jabel", q: 200, qf: 420, en: "Jabel", zh: "潔貝爾", full: { en: "Jabel Shard", zh: "潔貝爾碎片" } },
    SS: { i: "saul", q: 420, en: "Saul", zh: "薩洛", full: { en: "Saul Shard", zh: "薩洛碎片" } },
    CB: { i: "conqbook", q: 600, en: "Conquest", zh: "討伐書", full: { en: "Mythic Conquest Skill Book", zh: "傳說討伐技能書" } },
    EM: { i: "expbook", q: 600, en: "Expedition", zh: "遠征書", full: { en: "Mythic Expedition Skill Manual", zh: "傳說遠征技能書" } },
    EX: { i: "enhxp", q: 500, en: "Gear XP", zh: "強化經驗", full: { en: "100 Enhancement XP Part", zh: "100點強化經驗部件" } },
  };
  const KINDS = ["SU", "TP", "HB", "DB", "DP", "ES", "XP", "JS", "CB", "EM"];   // what a Sanctuary can give
  const GROUPS = ["NXS", "RED", "NRD", "ESA", "IDN"], FFA = "—";
  const FORT = { NXS: 2, RED: 3, NRD: 4, ESA: 1 };
  /* How the game works (Sherry 2026-11-23): a Sanctuary an alliance held in the previous phase is signed up again automatically, and each
     phase it can sign up for ONE more. So a group can change at most one Sanctuary per phase, and a Sanctuary is worth taking when it gives
     something useful for several phases in a row. The proposal below is one route per group, phase by phase: [Sanctuary, Sanctuary, the new one or 0].
     Two per group at most. */
  const NOW = { NXS: [1, 6], RED: [2, 3], NRD: [10, 11], ESA: [5, 12], IDN: [4] };
  /* "Buffs first" (Sherry 2026-11-23, the rule proposed in the NAP chat): every 12-hour combat buff goes to the top 3 (NXS, RED, NRD), which then
     also take as many of the other useful rewards as the one-new-sign-up-per-phase rule allows, each with a mix of the three buffs; ESA and IDN hold what is left. */
  const PLAN = {
    NXS: [[4, 0, 4], [4, 9, 9], [2, 9, 2], [7, 9, 7], [4, 7, 4], [4, 5, 5], [5, 10, 10], [7, 10, 7]],
    RED: [[8, 0, 8], [1, 8, 1], [1, 10, 10], [1, 3, 3], [3, 8, 8], [8, 9, 9], [6, 9, 6], [3, 6, 3]],
    NRD: [[12, 0, 12], [5, 12, 5], [6, 12, 6], [6, 12, 0], [11, 12, 11], [1, 12, 1], [1, 2, 2], [2, 11, 11]],
    ESA: [[2, 0, 2], [2, 7, 7], [4, 7, 4], [2, 4, 2], [1, 2, 1], [2, 3, 3], [3, 4, 4], [1, 4, 1]],
    IDN: [[3, 0, 3], [3, 11, 11], [5, 11, 5], [5, 11, 0], [5, 6, 6], [6, 7, 7], [7, 8, 8], [5, 8, 5]] };
  /* "Even" (the first draft): no group ends below what it has if nobody changes. */
  const EVEN = {
    NXS: [[12, 0, 12], [9, 12, 9], [9, 12, 0], [9, 12, 0], [9, 12, 0], [9, 12, 0], [2, 9, 2], [2, 3, 3]],
    RED: [[4, 0, 4], [1, 4, 1], [1, 4, 0], [1, 4, 0], [1, 4, 0], [1, 4, 0], [1, 6, 6], [1, 6, 0]],
    NRD: [[8, 0, 8], [5, 8, 5], [5, 8, 0], [5, 8, 0], [5, 8, 0], [5, 8, 0], [5, 10, 10], [5, 10, 0]],
    ESA: [[3, 0, 3], [3, 7, 7], [3, 10, 10], [3, 7, 7], [3, 7, 0], [3, 7, 0], [3, 7, 0], [4, 7, 4]],
    IDN: [[2, 0, 2], [2, 11, 11], [2, 6, 6], [2, 6, 0], [2, 11, 11], [2, 11, 0], [8, 11, 8], [8, 11, 0]] };
  /* a new season starts empty (Sherry 2026-11-23): nothing is signed up automatically in phase 1, so every group has ONE Sanctuary in phase 1 and two from phase 2 on */
  const FIRST = { NXS: 6, RED: 2, NRD: 10, ESA: 12, IDN: 4 };
  const KEEP = Object.fromEntries(GROUPS.map((g) => [g, Array.from({ length: 8 }, (_, p) => { const o = NOW[g].find((k) => k !== FIRST[g]) || 0; return p ? [FIRST[g], o, p === 1 ? o : 0] : [FIRST[g], 0, FIRST[g]]; })]));   // everyone takes back the ones it has now
  const T = {
    en: { h: "🏛️ Sanctuary split", sub: "Kingdom 2189 · NAP 5 · proposal for the next season",
      wantH: "What counts as a useful reward", wantP: "Ticked rewards are the ones we want for Kingdom of Power. Change the ticks and every number below follows.",
      splitH: "The split, phase by phase", splitP: "A Sanctuary a group held in the last phase is signed up again automatically, and each phase a group can sign up for one more. A new season starts empty, so in phase 1 every group has one Sanctuary, and two from phase 2 on. A group changes at most one Sanctuary per phase — the three combat buffs move to the next Sanctuary every phase, so following a buff takes that one sign-up. \"Buffs\" = how many of the season's 20 buff rewards the group gets; \"Useful\" = how many of its rewards in the season are ticked above.",
      vPlan: "Buffs to the top 3", vEven: "Even split", vNow: "Same as now", group: "Group", useful: "Useful", bufN: "Buffs", chg: "New sign-ups", gap: "Phases with nothing useful", none: "none", ffa: "Free for all",
      calH: "Who holds what in each phase", calP: "Highlighted = useful. The small number is the Sanctuary; ★ = newly signed up in that phase. The amount is what the alliance gets to hand out.", ph: "Phase", s: "Sanctuary",
      bufH: "Where the 12-hour buffs are", bufP: "The three combat buffs move to the next Sanctuary every phase (none in phase 5). The big number is the Sanctuary that gives the buff in that phase; under it, who holds it in this split.",
      movH: "Who signs up for a new one", mv: "{g} → Sanctuary {a}", mvFrom: " (from {o})", mvNone: "no changes", same: "Nothing changes.",
      fortH: "Fortresses", fortP: "Not part of this proposal — they stay as they are. Their special rewards are shards, books and Gear XP in every phase.", f: "Fortress",
      noteH: "Notes", notes: ["The reward table is the same one as last season. Phases 3, 5 and 8 were checked against the game; the others are from the Kingshot Wiki.", "Sanctuaries no group holds in a phase are free for all: seven in phase 1, two from phase 2 on. A group that held one of them in the phase before is still signed up for it.", "Buffs last 12 hours: Health and Damage are +20%, Deployment Capacity +20%."] },
    zh: { h: "🏛️ 遺跡分配", sub: "王國 2189 · NAP 5 · 下一個賽季的提案",
      wantH: "哪些算有用的獎勵", wantP: "打勾的是最強王國用得到的。改勾選，下面所有數字都會跟著變。",
      splitH: "每一期的分配", splitP: "上一期拿到的遺跡，下一期會自動報名；每一期還可以再多報名一座。新賽季從零開始，所以第 1 期每個集團只有一座，第 2 期起才有兩座。每個集團每期最多換一座——三種戰鬥增益每一期都會移到下一座遺跡，所以要跟著增益走，就是用掉那一次報名。「增益」＝整季 20 個增益獎勵裡這個集團拿到幾個；「有用」＝它整季的獎勵裡有幾個是上面打勾的。",
      vPlan: "增益給前三名", vEven: "平均分", vNow: "跟現在一樣", group: "集團", useful: "有用", bufN: "增益", chg: "新報名次數", gap: "沒有有用獎勵的期", none: "無", ffa: "自由搶",
      calH: "每一期誰拿哪一座", calP: "有底色＝有用。小數字是遺跡編號；★＝這一期新報名的。數量是聯盟可以分配的數量。", ph: "第", s: "遺跡",
      bufH: "12 小時增益在哪一座", bufP: "三種戰鬥增益每一期都會移到下一座遺跡（第 5 期沒有）。大數字是那一期給這個增益的遺跡，下面是這個分配裡拿到它的集團。",
      movH: "每一期誰要新報名", mv: "{g} → {a} 號遺跡", mvFrom: "（原本 {o}）", mvNone: "不用換", same: "沒有變動。",
      fortH: "要塞", fortP: "不在這次提案裡，維持現狀。要塞的特殊獎勵每一期都是碎片、技能書、強化經驗。", f: "要塞",
      noteH: "備註", notes: ["獎勵表跟上一季是同一張。第 3、5、8 期對過遊戲，其他期來自 Kingshot Wiki。", "沒有集團拿的遺跡就是自由搶：第 1 期有七座，第 2 期起每期兩座。上一期拿過其中一座的集團，這一期仍然會自動報名那一座。", "增益都是 12 小時：生命、傷害 +20%，出征數量 +20%。"] },
  };
  let lang = "en"; try { const l = localStorage.getItem("ks-lang"); if (l && l.startsWith("zh")) lang = "zh"; } catch (e) {}
  const q = new URLSearchParams(location.search); if (T[q.get("lang")]) lang = q.get("lang");
  const t = (k) => T[lang][k], $ = (id) => document.getElementById(id), esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  let want = new Set(["SU", "TP", "HB", "DB", "DP"]), view = "plan";
  const A = () => (view === "now" ? KEEP : view === "even" ? EVEN : PLAN), IDS = Object.keys(S).map(Number);
  const held = (g, p) => A()[g][p].slice(0, 2).filter((k, i, a) => k && a.indexOf(k) === i);
  const freeAt = (p) => { const used = new Set(GROUPS.flatMap((g) => held(g, p))); return IDS.filter((k) => !used.has(k)); };
  const ownerBefore = (k, p) => (p ? GROUPS.find((g) => held(g, p - 1).includes(k)) : "") || "";
  const BUFF = ["HB", "DB", "DP"];
  const stat = (g) => { let n = 0, tot = 0, chg = 0, buf = 0; const gap = [];
    for (let p = 0; p < 8; p++) { const L = held(g, p), c = L.filter((k) => want.has(S[k][p])).length; n += c; tot += L.length; buf += L.filter((k) => BUFF.includes(S[k][p])).length; if (!c) gap.push(p + 1); if (A()[g][p][2]) chg++; } return { n, tot, gap, chg, buf }; };
  const pic = (c) => `<img src="figures/items/rw-${ITEM[c].i}.webp" alt="" loading="lazy">`;
  const cell = (c, fort, k, isNew) => { const it = ITEM[c]; return `<span class="cell${want.has(c) ? " w" : ""}" title="${esc(it.full[lang])}">${k ? `<b class="sn">${k}${isNew ? " ★" : ""}</b>` : ""}<span class="ic">${pic(c)}<em>×${fort && it.qf ? it.qf : it.q}</em></span>${esc(it[lang])}</span>`; };

  function render() {
    document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en"; document.title = t("h").replace(/^\S+\s/, "");
    for (const k of ["h", "sub", "wantH", "wantP", "splitH", "splitP", "calH", "calP", "bufH", "bufP", "movH", "fortH", "fortP", "noteH"]) $("t_" + k).textContent = t(k);
    $("t_splitN").textContent = "";
    $("want").innerHTML = KINDS.map((c) => `<label class="chip${want.has(c) ? " on" : ""}"><input type="checkbox" data-w="${c}"${want.has(c) ? " checked" : ""}>${pic(c)}${esc(ITEM[c].full[lang])}</label>`).join("");
    $("views").innerHTML = [["plan", "vPlan"], ["even", "vEven"], ["now", "vNow"]].map(([v, k]) => `<button type="button" class="btn2${view === v ? " on" : ""}" data-v="${v}">${esc(t(k))}</button>`).join("");
    $("split").innerHTML = `<thead><tr><th>${esc(t("group"))}</th><th class="num">${esc(t("bufN"))}</th><th class="num">${esc(t("useful"))}</th><th class="num">${esc(t("chg"))}</th><th>${esc(t("gap"))}</th></tr></thead><tbody>`
      + GROUPS.map((g) => { const s = stat(g); return `<tr><td><b>${g}</b></td><td class="num">${s.buf}</td><td class="num">${s.n} / ${s.tot}<span class="bar"><i style="width:${Math.round(100 * s.n / Math.max(1, s.tot))}%"></i></span></td><td class="num">${s.chg}</td><td>${s.gap.length ? s.gap.join(", ") : esc(t("none"))}</td></tr>`; }).join("") + `</tbody>`;
    const head = `<thead><tr><th>${esc(t("group"))}</th>${[1, 2, 3, 4, 5, 6, 7, 8].map((p) => `<th>${lang === "zh" ? `${t("ph")} ${p} 期` : `${t("ph")} ${p}`}</th>`).join("")}</tr></thead>`;
    $("cal").innerHTML = head + `<tbody>` + GROUPS.map((g) => `<tr><td><b>${g}</b></td>${[0, 1, 2, 3, 4, 5, 6, 7].map((p) => `<td><span class="two">${held(g, p).map((k) => cell(S[k][p], false, k, A()[g][p][2] === k)).join("")}</span></td>`).join("")}</tr>`).join("")
      + `<tr class="ffa"><td><b>${esc(t("ffa"))}</b></td>${[0, 1, 2, 3, 4, 5, 6, 7].map((p) => `<td><span class="two">${freeAt(p).map((k) => cell(S[k][p], false, k)).join("")}</span></td>`).join("")}</tr></tbody>`;
    $("fort").innerHTML = head.replace(esc(t("group")), esc(t("f"))) + `<tbody>` + [1, 2, 3, 4].map((k) => `<tr><td><b>${k}</b><span class="tag">${Object.keys(FORT).find((g) => FORT[g] === k) || ""}</span></td>${F[k].map((c) => `<td>${cell(c, true)}</td>`).join("")}</tr>`).join("") + `</tbody>`;
    $("buf").innerHTML = head.replace(esc(t("group")), "") + `<tbody>` + ["HB", "DB", "DP"].map((c) => `<tr><td><span class="chip" style="cursor:default">${pic(c)}${esc(ITEM[c][lang])}</span></td>${[0, 1, 2, 3, 4, 5, 6, 7].map((p) => { const k = IDS.find((x) => S[x][p] === c), o = k ? GROUPS.find((g) => held(g, p).includes(k)) : "";
      return `<td>${k ? `<b style="font-size:17px">${k}</b><br><span class="tag" style="margin:0">${o || esc(t("ffa"))}</span>` : "—"}</td>`; }).join("")}</tr>`).join("") + `</tbody>`;
    const M = [];
    for (let p = 0; p < 8; p++) { const L = GROUPS.filter((g) => A()[g][p][2]).map((g) => { const k = A()[g][p][2], o = ownerBefore(k, p); return t("mv").replace("{g}", g).replace("{a}", k) + (o && o !== g ? t("mvFrom").replace("{o}", o) : ""); });
      M.push(`<b>${lang === "zh" ? `${t("ph")} ${p + 1} 期` : `${t("ph")} ${p + 1}`}</b> — ${L.length ? L.map(esc).join(lang === "zh" ? "；" : "; ") : esc(t("mvNone"))}`); }
    $("movesCard").hidden = view === "now"; $("moves").innerHTML = M.map((x) => `<li>${x}</li>`).join("");
    $("notes").innerHTML = t("notes").map((x) => `<li>${esc(x)}</li>`).join("");
    document.querySelectorAll("[data-w]").forEach((x) => x.onchange = () => { x.checked ? want.add(x.dataset.w) : want.delete(x.dataset.w); render(); });
    document.querySelectorAll("[data-v]").forEach((x) => x.onclick = () => { view = x.dataset.v; render(); });
  }
  $("lang").value = lang; $("lang").onchange = () => { lang = $("lang").value; render(); };
  render();
})();
</script>
</body>
</html>
