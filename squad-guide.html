<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Squad Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef1f4;--panel:#fff;--sunk:#f5f7f9;--fg:#1b2430;--muted:#5d6876;--line:#d5dbe2;--accent:#a8740c;--accent-soft:#f6ebd2;--red:#e23428;
  --display:"Chakra Petch","Noto Sans TC",system-ui,sans-serif;--body:"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--panel:#1a2129;--sunk:#151b22;--fg:#e4e8ec;--muted:#9aa5b1;--line:#2c3642;--accent:#e0aa3e;--accent-soft:#3a2e15;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171d;--panel:#1a2129;--sunk:#151b22;--fg:#e4e8ec;--muted:#9aa5b1;--line:#2c3642;--accent:#e0aa3e;--accent-soft:#3a2e15;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-family:var(--display);font-weight:700;font-size:1.6rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:70ch}
.hdr-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
select{padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);color:var(--fg);font:inherit}
.back{color:var(--accent);font-size:.85rem;text-decoration:none}.back::before{content:"‹ "}[dir=rtl] .back::before{content:"› "}
.tabs{display:flex;gap:8px;margin:14px 0}
.tabs button{flex:1;border:1px solid var(--line);background:var(--sunk);color:var(--fg);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer;text-align:start}
.tabs button b{display:block;font-family:var(--display)}
.tabs button span{color:var(--muted);font-size:.8rem}
.tabs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.steps{display:flex;flex-direction:column;gap:14px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px;align-items:start}
@media (max-width:640px){.st{grid-template-columns:minmax(0,1fr)}}
.st .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;font-family:var(--display);margin-inline-end:8px}
.st p{margin:0;display:flex;align-items:flex-start;gap:4px}
.st img{width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:#000}
.st.wide{grid-template-columns:minmax(0,1fr)}
.st.wide img{max-height:none}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.case{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.case h3{margin:0;font-family:var(--display);font-size:1rem}
.case .n{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:14px;background:var(--red);color:#fff;font-weight:700;font-family:var(--display);margin-inline-end:8px}
.case img{width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
.tip{background:var(--sunk);border-radius:10px;padding:12px 14px;font-size:.9rem;margin-top:16px}
.note{color:var(--muted);font-size:.8rem;margin-top:10px}
[dir=rtl] .st .n{margin-inline-end:0;margin-inline-start:0;margin-left:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 id="title"></h1><p class="sub" id="intro"></p></div>
    <div class="hdr-r"><select id="lang" aria-label="Language"></select><a id="back" class="back" href="index.html"><span id="backT"></span></a></div>
  </header>
  <div class="steps" id="steps"></div>
  <div class="tip" id="tip"></div>
  <div class="note" id="note"></div>
</div>
<script src="data/squad-guide.js"></script>
<script>
(function(){
const G=SQUAD_GUIDE, CODES=G.langs.map(l=>l[0]);
let LANG=(()=>{let l="";try{l=new URLSearchParams(location.search).get("lang")||""}catch(e){}
  if(!CODES.includes(l)){try{l=localStorage.getItem("ks-lang")||""}catch(e){}} return CODES.includes(l)?l:"en"})();
const HTML_LANG={zh:"zh-Hant",pt:"pt-BR"};
const $=id=>document.getElementById(id);
const T=k=>{const v=G.ui[k];return Array.isArray(v)?v.map(x=>x&&(x[LANG]||x.en)):(v[LANG]||v.en)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
  document.documentElement.lang=HTML_LANG[LANG]||LANG;document.documentElement.dir=LANG==="ar"?"rtl":"ltr";
  document.title=T("title");$("title").textContent=T("title");$("intro").textContent=T("intro");$("backT").textContent=T("back");
  $("back").href="index.html#/"+LANG;
  $("lang").innerHTML=G.langs.map(([c,n])=>`<option value="${c}"${c===LANG?" selected":""}>${n}</option>`).join("");
  const set=G.shots[LANG]||G.fallbackShots, dir="img/squad/"+set+"/";
  const steps=T("steps");
  const st=(i,img,wide)=>`<div class="st${img?"":" wide"}"><p><span class="n">${i+1}</span><span>${esc(steps[i])}</span></p>${img?`<img src="${dir}${img}.webp" alt="" loading="lazy">`:""}</div>`;
  $("steps").innerHTML=st(0,"main")+st(1,"profile")+st(2,"troops")+st(3,"deploy")+
    `<div class="cases"><div class="case"><h3><span class="n">5a</span>${esc(T("caseA"))}</h3><p>${esc(T("caseAt"))}</p></div>`+
    `<div class="case"><h3><span class="n">5b</span>${esc(T("caseB"))}</h3><p>${esc(T("caseBt"))}</p><img src="${dir}bottom.webp" alt="" loading="lazy"></div></div>`+
    `<div class="st"><p><span class="n">6</span><span>${esc(T("s7"))}</span></p><img src="${dir}save.webp" alt="" loading="lazy"></div>`+
    `<div class="cases"><div class="case"><h3><span class="n">7a</span>${esc(T("s7a"))}</h3></div><div class="case"><h3><span class="n">7b</span>${esc(T("s7b"))}</h3></div></div>`+
    `<div class="st wide"><p><span class="n">8</span><span>${esc(T("s8"))}</span></p></div>`;
  $("tip").textContent=T("tip");
  $("note").textContent=set===LANG?"":T("shotNote").replace("{l}",G.shotLangName[set]);
}
$("lang").onchange=e=>{LANG=e.target.value;try{history.replaceState(null,"","?lang="+LANG)}catch(x){}render()};
render();
})();
</script>
<script src="js/track.js" defer></script>
</body>
</html>
