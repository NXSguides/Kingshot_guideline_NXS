<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>NXS Roster</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="css/styles.css">
<style>
  body { padding: 16px; }
  .wrap { max-width: 980px; margin: 0 auto; }
  h1 { font-family: "Oswald", "Noto Sans TC", sans-serif; margin: 0 0 4px; font-size: 26px; }
  .muted { color: var(--text-muted); font-size: 13px; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .btn { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--panel); color: var(--text); cursor: pointer; font-size: 14px; }
  a.btn { text-decoration: none; display: inline-block; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .card { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 14px; margin: 14px 0; box-shadow: 0 4px 14px var(--shadow); }
  .card h2 { margin: 0 0 10px; font-size: 18px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .w { display: flex; align-items: center; gap: 6px; background: var(--panel-2); padding: 8px 10px; border-radius: 10px; }
  .w input { width: 70px; padding: 6px 8px; font-size: 16px; border-radius: 6px; border: 1px solid var(--rule); background: var(--panel); color: var(--text); text-align: end; }
  input[type=search], textarea { width: 100%; box-sizing: border-box; padding: 9px 11px; font-size: 15px; border-radius: 8px; border: 1px solid var(--rule); background: var(--panel-2); color: var(--text); font-family: inherit; }
  textarea { min-height: 80px; }
  .tbl-wrap { overflow-x: auto; margin-top: 10px; max-height: 60vh; overflow-y: auto; border: 1px solid var(--rule); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; text-align: start; }
  th { position: sticky; top: 0; background: var(--panel-2); cursor: pointer; user-select: none; z-index: 1; }
  td.num, th.num { text-align: end; font-variant-numeric: tabular-nums; }
  tr.on td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  tr.member, tr.grp { cursor: pointer; }
  tr.grp td { background: var(--panel-2); border-top: 2px solid var(--rule); }
  .name { font-weight: 600; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  .bar { display: inline-block; height: 8px; border-radius: 4px; background: var(--accent); vertical-align: middle; margin-inline-start: 6px; }
  .warn { color: var(--accent); }
  .msg { margin-top: 6px; font-size: 13px; }
  details summary { cursor: pointer; font-weight: 600; }
  .grp-out h3 { margin: 14px 0 6px; font-size: 16px; }
  .grp-out ol { margin: 0; padding-inline-start: 26px; }
  .grp-out li { padding: 2px 0; }
  .btn.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  .tabs { display: flex; gap: 6px; margin: 14px 0 0; border-bottom: 2px solid var(--rule); }
  .tabs a { padding: 9px 14px; border-radius: 10px 10px 0 0; text-decoration: none; color: var(--text-muted); font-weight: 600; border: 1px solid transparent; border-bottom: 0; }
  .tabs a.on { color: var(--text); background: var(--panel); border-color: var(--rule); margin-bottom: -2px; border-bottom: 2px solid var(--panel); }
  @media (max-width: 440px) { .tabs { gap: 0; flex-wrap: nowrap; overflow-x: auto; } .tabs a { padding: 8px 6px; font-size: 13px; white-space: nowrap; } }
  .tb-setup { background: var(--panel-2); border-radius: 10px; padding: 8px 12px; }
  .tb-setup summary { cursor: pointer; font-weight: 600; }
  .tb-setup .f { display: block; margin: 8px 0 4px; font-weight: 600; font-size: 14px; }
  .tb-setup input[type=text] { width: 100%; box-sizing: border-box; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--rule); background: var(--panel); color: var(--text); font-size: 15px; }
  .tb-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .tb-cols label { display: flex; gap: 6px; align-items: center; }
  .tb-sticky { position: sticky; top: 0; z-index: 5; background: var(--panel); padding: 4px 0 8px; }
  .tb-pool-h { font-size: 13px; font-weight: 600; margin: 6px 0; }
  .tb-pool { display: flex; flex-wrap: wrap; gap: 6px; max-height: 190px; overflow-y: auto; padding: 8px; background: var(--panel-2); border-radius: 10px; }
  .tb-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 999px; background: var(--panel); border: 1px solid var(--rule); font-size: 13px; cursor: pointer; user-select: none; margin: 2px; }
  .tb-counts { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 6px; font-size: 13px; }
  .tb-counts input { width: 52px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--rule); background: var(--panel-2); color: var(--text); font-size: 15px; }
  .tb-role { width: 100%; }
  .tb-role-h { font-size: 12px; font-weight: 700; margin: 2px 0 2px; }
  .tb-role-h span { font-weight: 400; color: var(--text-muted); }
  .tb-role.r0 .tb-role-h { color: #b3261e; } .tb-chip.pool.r0 { border-color: #d77a72; background: color-mix(in srgb, #e57373 18%, var(--panel)); }
  .tb-role.r1 .tb-role-h { color: #1d5fa8; } .tb-chip.pool.r1 { border-color: #7aa7d7; background: color-mix(in srgb, #64b5f6 18%, var(--panel)); }
  .tb-role.r2 .tb-role-h { color: var(--text-muted); }
  .tb-chip.pool.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .tb-chip i { font-style: normal; font-size: 11px; background: var(--text-muted); color: var(--panel); border-radius: 999px; padding: 0 5px; }
  .tb-chip.txt { font-style: italic; }
  .tb-x { font-weight: 700; opacity: .55; padding: 0 2px; }
  .tb-group { border: 2px solid; border-radius: 12px; padding: 10px; margin: 12px 0; }
  .tb-ghead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
  .tb-swatches { display: flex; gap: 4px; flex-wrap: wrap; }
  .tb-sw { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  .tb-sw.on { border-color: var(--text); }
  .tb-row { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 8px; margin-bottom: 8px; }
  .tb-rowtop { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
  .tb-in { display: flex; flex-direction: column; font-size: 12px; color: var(--text-muted); flex: 1; min-width: 90px; }
  .tb-in.wide { margin-top: 6px; }
  .tb-in input { padding: 6px 8px; border-radius: 6px; border: 1px solid var(--rule); background: var(--panel-2); color: var(--text); font-size: 15px; }
  .tb-rowbtns { display: flex; gap: 4px; }
  .btn.small { padding: 4px 9px; font-size: 13px; }
  .tb-cell { margin-top: 6px; padding: 6px; min-height: 30px; border: 1px dashed var(--rule); border-radius: 8px; cursor: pointer; }
  .tb-lab { font-size: 12px; color: var(--text-muted); margin-bottom: 2px; }
  .tb-add { display: inline-block; font-size: 12px; color: var(--text-muted); padding: 3px 6px; cursor: pointer; }
  .tb-modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 60; display: grid; place-items: center; padding: 12px; overflow: auto; }
  .tb-modal .card { max-width: 96vw; }
  .empty { padding: 20px; text-align: center; color: var(--text-muted); }
</style>
</head>
<body>
<div class="wrap" id="main">
  <div class="top">
    <div>
      <h1 data-t="title"></h1>
      <div class="muted" id="meta"></div>
    </div>
    <div class="row">
      <a class="btn" href="./" id="homeBtn">← <span data-t="home"></span></a>
      <button class="btn" id="langBtn"></button>
    </div>
  </div>

  <nav class="tabs">
    <a href="roster-x7k2p9.html" class="on" data-tab="ranking">📊 Ranking</a>
    <a href="post-k4m8q2.html" data-tab="post">📢 Post</a>
    <a href="watch-x7k2p9.html" data-tab="watch">🕵️ Watch</a>
    <a href="events-x7k2p9.html" data-tab="events">📅 Events</a>
  </nav>

  <div id="gate" class="card" hidden style="max-width:360px;margin:24px auto">
    <h2>🔒 Officer password</h2>
    <input type="password" id="gatePw" autocomplete="current-password" style="width:100%;box-sizing:border-box;padding:10px;font-size:16px;border-radius:8px;border:1px solid var(--rule);background:var(--panel-2);color:var(--text)">
    <label class="row" style="margin-top:8px;font-size:14px"><input type="checkbox" id="gateRemember" checked> Remember on this device / 在這台裝置記住</label>
    <div style="margin-top:10px"><button class="btn primary" id="gateBtn" style="width:100%;padding:12px">Unlock / 解鎖</button></div>
    <div class="msg warn" id="gateErr" hidden>Wrong password / 密碼錯誤</div>
  </div>
  <div id="noData" class="card" hidden></div>

  <div id="app" hidden>
    <!-- 1. weights -->
    <div class="card">
      <h2 data-t="weights"></h2>
      <div class="row">
        <label class="w"><span data-t="power"></span><input type="number" id="wPower" min="0" max="100" step="5"> %</label>
        <label class="w"><span data-t="mystic"></span><input type="number" id="wMystic" min="0" max="100" step="5"> %</label>
      </div>
      <div class="muted msg" data-t="weightNote"></div>
    </div>

    <!-- 2. pick participants -->
    <div class="card">
      <h2><span data-t="pick"></span> <span class="muted" id="pickCount"></span></h2>
      <div class="row" style="margin-bottom:8px">
        <button class="btn" id="allBtn" data-t="all"></button>
        <button class="btn" id="noneBtn" data-t="none"></button>
      </div>
      <details style="margin-bottom:8px">
        <summary data-t="paste"></summary>
        <div class="muted msg" data-t="pasteNote"></div>
        <textarea id="pasteBox"></textarea>
        <div class="row" style="margin-top:6px"><button class="btn" id="pasteBtn" data-t="pasteGo"></button></div>
        <div class="msg" id="pasteMsg"></div>
      </details>
      <input type="search" id="q">
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th></th>
            <th data-sort="name" data-t="colName"></th>
            <th data-sort="rank" data-t="colRank"></th>
            <th data-sort="tc" class="num" data-t="colTc"></th>
            <th data-sort="power" class="num" data-t="power"></th>
            <th data-sort="mystic" class="num" data-t="mystic"></th>
          </tr></thead>
          <tbody id="list"></tbody>
        </table>
      </div>
    </div>

    <!-- 3. result -->
    <div class="card">
      <div class="top">
        <h2 data-t="result"></h2>
        <button class="btn primary" id="copyBtn" data-t="copy"></button>
      </div>
      <div class="tbl-wrap" style="max-height:none">
        <table>
          <thead><tr>
            <th class="num">#</th>
            <th data-t="colName"></th>
            <th class="num" data-t="colScore"></th>
            <th class="num" data-t="power"></th>
            <th class="num" data-t="mystic"></th>
          </tr></thead>
          <tbody id="result"></tbody>
        </table>
      </div>
      <div class="muted msg" data-t="scoreNote"></div>
    </div>

    <!-- 4. event presets -->
    <div class="card">
      <div class="top">
        <h2 data-t="events"></h2>
        <button class="btn primary" id="presetCopy" data-t="copy" hidden></button>
      </div>
      <div class="muted msg" data-t="eventsNote" style="margin:0 0 8px"></div>
      <div class="row" id="presetBtns"></div>
      <div class="row" id="presetCounts" style="margin-top:10px"></div>
      <div id="presetOut"></div>
    </div>

    <!-- 5. battle table -->
    <div class="card" id="tbCard"></div>
  </div>
</div>

<script src="js/officer-data.js"></script>
<script>
const DATA_URL = "data/roster-x7k2p9.json";
const T = {
  zh: {
    title: "NXS 成員排序", home: "回主頁", weights: "① 占比", power: "總戰力", mystic: "秘境試煉",
    weightNote: "兩個加起來是 100%，改一個另一個會自動調整。",
    pick: "② 勾選這次參戰的人", all: "全選", none: "全部取消",
    paste: "貼上報名名單一次勾選", pasteNote: "一行一個名字（或用逗號分隔）。名字前後的符號和 Nexus 標記可以省略，大小寫沒關係。標 (?) 的表示有好幾個人符合，請手動勾選。",
    pasteGo: "勾選這些人", pasteOk: "已勾選 {n} 人。", pasteMiss: "找不到：{list}",
    search: "搜尋名字…", colName: "名字", colRank: "階級", colTc: "主城", colActive: "上次上線",
    rest: "剩下的人", events: "④ 活動分組", eventsNote: "依上面的排序結果（加權分數高到低）分組。", n: "{n} 人",
    result: "③ 排序結果", copy: "複製結果", copied: "已複製！", colScore: "分數",
    scoreNote: "分數算法：兩項各自以「這次勾選的人裡面最高的那個 = 100」換算，再依占比加總。沒有秘境數字的人以 0 計，標 ?。",
    empty: "還沒勾選任何人。", selected: "已選 {n} / {t} 人",
    updated: "資料更新：{t}（{ago}）", members: "{n} 名成員",
    noData: "還沒有資料。請到 GitHub → Actions → 「Update Roster (MightPulse)」→ Run workflow，跑完後重新整理這頁。",
    ago: { now: "剛剛", m: "{n} 分鐘前", h: "{n} 小時前", d: "{n} 天前" },
  },
  en: {
    title: "NXS Roster Ranking", home: "Home", weights: "① Weights", power: "Total Power", mystic: "Mystic Trial",
    weightNote: "The two add up to 100% — changing one adjusts the other.",
    pick: "② Tick this event's participants", all: "Select all", none: "Clear",
    paste: "Paste a sign-up list to tick at once", pasteNote: "One name per line (or comma-separated). Decorations like ♛ and the Nexus tag can be left out; case doesn't matter. (?) means several players match — tick that one by hand.",
    pasteGo: "Tick these players", pasteOk: "Ticked {n} players.", pasteMiss: "Not found: {list}",
    search: "Search a name…", colName: "Name", colRank: "Rank", colTc: "TC", colActive: "Last online",
    rest: "everyone left", events: "④ Event groups", eventsNote: "Groups follow the ranking above (highest weighted score first).", n: "{n}",
    result: "③ Ranking", copy: "Copy result", copied: "Copied!", colScore: "Score",
    scoreNote: "Score: each stat is scaled so the highest among the ticked players = 100, then combined by the weights. Players with no Mystic Trial value count as 0 (marked ?).",
    empty: "Nobody ticked yet.", selected: "{n} / {t} selected",
    updated: "Data updated: {t} ({ago})", members: "{n} members",
    noData: "No data yet. Go to GitHub → Actions → “Update Roster (MightPulse)” → Run workflow, then reload this page.",
    ago: { now: "just now", m: "{n} min ago", h: "{n} h ago", d: "{n} d ago" },
  },
};
/* ---- Event presets: add a new event by copying one entry. count: null = everyone left ---- */
const PRESETS = [
  { id: "swordland", emoji: "⚔️", name: { en: "Swordland Showdown", zh: "聖劍爭奪" },
    groups: [
      { name: { en: "Attackers", zh: "攻擊者" }, count: 4 },
      { name: { en: "Defenders", zh: "防守者" }, count: 6 },
      { name: { en: "Joiners", zh: "參與者" }, count: null },
    ] },
];
const LS = "nxs-roster-v2";
const store = (() => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } })();
const save = () => { try { localStorage.setItem(LS, JSON.stringify(store)); } catch (e) {} };

/* one language for all officer tabs (set from the main site when you enter, and by the language button on any tab) */
const OFFICER_LANG = "nxs-officer-lang";
const officerLang = () => { try { const v = localStorage.getItem(OFFICER_LANG); return v === "zh" || v === "en" ? v : null; } catch (e) { return null; } };
const setOfficerLang = (v) => { try { localStorage.setItem(OFFICER_LANG, v); } catch (e) {} };
let lang = officerLang() || store.lang || "en";
let data = null, sortKey = store.sortKey || "rank", sortDir = store.sortDir || -1;
let picked = new Set(store.picked || []);
let wPower = store.wPower ?? 40;

const $ = (id) => document.getElementById(id);
const tr = (k, vars = {}) => String(k.split(".").reduce((o, x) => o && o[x], T[lang]) ?? k).replace(/\{(\w+)\}/g, (m, v) => vars[v] ?? m);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const big = (n) => n == null ? "?" : n >= 1e9 ? (n / 1e9).toFixed(2) + "B" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(n);
const toMs = (v) => v == null ? null : (typeof v === "number" ? (v < 1e12 ? v * 1000 : v) : Date.parse(v));
function ago(v) {
  const ms = toMs(v); if (!ms) return "?";
  const s = (Date.now() - ms) / 1000;
  if (s < 60) return tr("ago.now");
  if (s < 3600) return tr("ago.m", { n: Math.floor(s / 60) });
  if (s < 86400) return tr("ago.h", { n: Math.floor(s / 3600) });
  return tr("ago.d", { n: Math.floor(s / 86400) });
}
const rankNum = (m) => { const r = String(m.rank || ""); if (/leader|r5/i.test(r)) return 5; const n = r.match(/\d/); return n ? Number(n[0]) : 0; };
const rankLabel = (m) => rankNum(m) ? "R" + rankNum(m) : (m.rank || "?");
const norm = (s) => String(s || "").trim().toLowerCase();
// name without decorations (♛, superscript "Nexus" tag, spaces, symbols) — for matching pasted names
const core = (s) => String(s || "").normalize("NFKC").toLowerCase().replace(/nexus/g, "").replace(/[^\p{L}\p{N}]/gu, "");

function applyTexts() {
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = tr(el.dataset.t); });
  $("q").placeholder = tr("search");
  $("langBtn").textContent = lang === "zh" ? "English" : "中文";
  if (data) $("meta").textContent = `${data.alliance?.tag ? "[" + data.alliance.tag + "] " : ""}${tr("members", { n: data.members.length })} · ${tr("updated", { t: new Date(data.updated).toLocaleString(lang === "zh" ? "zh-TW" : "en-GB"), ago: ago(data.updated) })}`;
  $("noData").textContent = tr("noData");
}

function renderList() {
  const q = norm($("q").value);
  const rows = data.members
    .filter((m) => !q || norm(m.name).includes(q) || core(m.name).includes(core(q)))
    .sort((a, b) => {
      if (sortKey === "rank") return sortDir * (rankNum(a) - rankNum(b)) || (b.power || 0) - (a.power || 0);
      let x = a[sortKey], y = b[sortKey];
      if (sortKey === "lastActive") { x = toMs(x) || 0; y = toMs(y) || 0; }
      if (typeof x === "string" || typeof y === "string") return sortDir * String(x ?? "").localeCompare(String(y ?? ""));
      return sortDir * ((x ?? -1) - (y ?? -1));
    });
  let lastRank = null;
  $("list").innerHTML = rows.map((m) => {
    let head = "";
    if (sortKey === "rank" && rankNum(m) !== lastRank) {
      lastRank = rankNum(m);
      const grp = rows.filter((x) => rankNum(x) === lastRank);
      const on = grp.filter((x) => picked.has(x.id)).length;
      head = `<tr class="grp" data-r="${lastRank}"><td><input type="checkbox" tabindex="-1" ${on === grp.length ? "checked" : ""}></td><td colspan="5"><b>${esc(rankLabel(m))}</b> <span class="muted">· ${on} / ${grp.length}</span></td></tr>`;
    }
    return head + `
    <tr class="member${picked.has(m.id) ? " on" : ""}" data-id="${m.id}">
      <td><input type="checkbox" ${picked.has(m.id) ? "checked" : ""} tabindex="-1"></td>
      <td class="name" dir="auto">${esc(m.name)}</td>
      <td>${esc(rankLabel(m))}</td>
      <td class="num">${m.tc ?? "?"}</td>
      <td class="num">${big(m.power)}</td>
      <td class="num">${big(m.mystic)}</td>
    </tr>`;
  }).join("");
  $("pickCount").textContent = tr("selected", { n: picked.size, t: data.members.length });
  document.querySelectorAll("th[data-sort]").forEach((th) => {
    th.textContent = tr(th.dataset.t) + (th.dataset.sort === sortKey ? (sortDir < 0 ? " ▼" : " ▲") : "");
  });
}

function ranking() {
  const sel = data.members.filter((m) => picked.has(m.id));
  const maxP = Math.max(1, ...sel.map((m) => m.power || 0));
  const maxM = Math.max(1, ...sel.map((m) => m.mystic || 0));
  const wp = wPower / 100, wm = 1 - wp;
  return sel.map((m) => ({ ...m, score: 100 * (wp * (m.power || 0) / maxP + wm * (m.mystic || 0) / maxM) }))
    .sort((a, b) => b.score - a.score);
}

function renderResult() {
  setTimeout(renderPresets, 0);
  setTimeout(() => { if (typeof tbRender === "function") tbRender(); }, 0);
  const r = ranking();
  $("result").innerHTML = r.length ? r.map((m, i) => `
    <tr>
      <td class="num">${i + 1}</td>
      <td class="name"><span dir="auto">${esc(m.name)}</span><div style="font-size:12px;opacity:.65;font-variant-numeric:tabular-nums;user-select:all">ID ${esc(m.id)}</div></td>

/* ===== officer password (shared with the Post tab: same password, same saved login) ===== */
const OFFICER_LS = "nxs-post-v1";
const b64dec_ = (b64) => Uint8Array.from(atob(b64.replace(/\s/g, "")), (c) => c.charCodeAt(0));
async function officerCheck(pw, blob) {
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64dec_(blob.salt), iterations: blob.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64dec_(blob.iv) }, key, b64dec_(blob.data));
    return true;
  } catch (e) { return false; }
}
function officerStore() { try { return JSON.parse(localStorage.getItem(OFFICER_LS)) || {}; } catch (e) { return {}; } }
async function officerGate(onOk) {
  let blob = null;
  try { const r = await fetch("data/post-key.json?t=" + Date.now(), { cache: "no-store" }); blob = r.ok ? await r.json() : null; } catch (e) {}
  if (!blob) return onOk();                         // not set up yet → open
  const st = officerStore();
  if (st.pw && (await officerCheck(st.pw, blob))) { await OfficerData.unlock(st.pw); return onOk(); }
  $("gate").hidden = false;
  const go = async () => {
    const pw = $("gatePw").value;
    if (await officerCheck(pw, blob)) {
      await OfficerData.unlock(pw);
      if ($("gateRemember").checked) { const s = officerStore(); s.pw = pw; try { localStorage.setItem(OFFICER_LS, JSON.stringify(s)); } catch (e) {} }
      $("gate").hidden = true; onOk();
    } else { $("gateErr").hidden = false; $("gatePw").value = ""; $("gatePw").focus(); }
  };
  $("gateBtn").onclick = go;
  $("gatePw").onkeydown = (e) => { if (e.key === "Enter") go(); };
  $("gatePw").focus();
}

/* ----- editing ----- */
function tbPut(gi, ri, k, chip) {
  const arr = TB.groups[gi].rows[ri][k];
  if (chip.kind === "p" && arr.some((x) => x.kind === "p" && String(x.id) === String(chip.id))) return;
  arr.push(chip);
}
function tbDraft() {
  const pr = PRESETS.find((x) => x.id === "swordland");
  const A = groupCount(pr, 0), D = groupCount(pr, 1);
  const r = ranking(); if (!r.length) return;
  const nG = Math.max(1, Math.min(A, r.length));
  const stage = listOf(TB.stages)[0] || "";
  TB.groups = Array.from({ length: nG }, (_, i) => ({ color: TB_COLORS[i % TB_COLORS.length], rows: [newRow(stage)] }));
  r.forEach((m, i) => {
    const chip = { kind: "p", id: m.id };
    if (i < nG) TB.groups[i].rows[0].att.push(chip);
    else if (i < nG + D) TB.groups[(i - nG) % nG].rows[0].def.push(chip);
    else TB.groups[(i - nG - D) % nG].rows[0].join.push(chip);
  });
}

function tbClick(e) {
  const t = e.target;
  // remove chip
  if (t.dataset.del) { const c = t.closest(".tb-chip"); TB.groups[c.dataset.g].rows[c.dataset.r][c.dataset.k].splice(c.dataset.x, 1); tbSave(); tbRender(); return; }
  // pick from pool
  const pc = t.closest(".tb-chip.pool");
  if (pc) { const id = pc.dataset.pid; tbPick = tbPick && tbPick.kind === "p" && String(tbPick.id) === String(id) ? null : { kind: "p", id: Number(id) || id }; tbRender(); return; }
  // add free text
  if (t.dataset.addtext) {
    const v = window.prompt(tt("textPrompt")); if (v && v.trim()) { tbPut(t.dataset.g, t.dataset.r, t.dataset.k, { kind: "t", text: v.trim() }); tbSave(); tbRender(); }
    return;
  }
  // put picked into a cell
  const cl = t.closest(".tb-cell");
  if (cl && tbPick) { tbPut(cl.dataset.g, cl.dataset.r, cl.dataset.k, tbPick); tbSave(); tbRender(); return; }
  // colour
  if (t.dataset.color) { TB.groups[t.dataset.g].color = t.dataset.color; tbSave(); tbRender(); return; }
  const a = t.closest("[data-act]"); if (!a) return;
  const gi = a.dataset.g, ri = a.dataset.r, act = a.dataset.act;
  if (act === "addGroup") TB.groups.push({ color: TB_COLORS[TB.groups.length % TB_COLORS.length], rows: [newRow(listOf(TB.stages)[0] || "")] });
  if (act === "delGroup") TB.groups.splice(gi, 1);
  if (act === "addRow") TB.groups[gi].rows.push(newRow(listOf(TB.stages)[0] || ""));
  if (act === "delRow") TB.groups[gi].rows.splice(ri, 1);
  if (act === "dupRow") { const r = JSON.parse(JSON.stringify(TB.groups[gi].rows[ri])); r.id = ++tbUid; TB.groups[gi].rows.splice(Number(ri) + 1, 0, r); }
  if (act === "clear") { if (!window.confirm(tt("confirmClear"))) return; TB.groups = []; }
  if (act === "draft") { if (TB.groups.length && !window.confirm(tt("confirmDraft"))) return; tbDraft(); }
  if (act === "image") return tbImage();
  if (act === "text") return tbCopyText(a);
  tbSave(); tbRender();
}
function tbInput(e) {
  const t = e.target;
  if (t.dataset.rolecount !== undefined) {
    const v = Math.max(0, Math.min(99, Math.round(Number(t.value) || 0)));
    store.counts = store.counts || {}; store.counts.swordland = store.counts.swordland || {};
    store.counts.swordland[t.dataset.rolecount] = v; save(); renderPresets(); return;
  }
  if (t.dataset.field) { TB.groups[t.dataset.g].rows[t.dataset.r][t.dataset.field] = t.value; tbSave(); return; }
  if (t.dataset.set === "short") { TB.short = t.checked; tbSave(); tbRender(); return; }
  if (t.dataset.set) { TB[t.dataset.set] = t.value; tbSave(); return; }
  if (t.dataset.col) { TB.cols[t.dataset.col] = t.value; tbSave(); return; }
  if (t.dataset.show) { TB.show[t.dataset.show] = t.checked; tbSave(); tbRender(); return; }
}
/* drag & drop (computer) */
let tbDrag = null;
function tbDragStart(e) {
  const c = e.target.closest(".tb-chip"); if (!c) return;
  tbDrag = c.dataset.pid ? { chip: { kind: "p", id: Number(c.dataset.pid) || c.dataset.pid } }
    : { chip: TB.groups[c.dataset.g].rows[c.dataset.r][c.dataset.k][c.dataset.x], from: [c.dataset.g, c.dataset.r, c.dataset.k, c.dataset.x] };
  e.dataTransfer.effectAllowed = "move"; try { e.dataTransfer.setData("text/plain", "x"); } catch (err) {}
}
function tbDrop(e) {
  const cl = e.target.closest(".tb-cell"); if (!cl || !tbDrag) return;
  e.preventDefault();
  if (tbDrag.from) { const [g, r, k, x] = tbDrag.from; TB.groups[g].rows[r][k].splice(x, 1); }
  tbPut(cl.dataset.g, cl.dataset.r, cl.dataset.k, tbDrag.chip);
  tbDrag = null; tbSave(); tbRender();
}

/* ----- output ----- */
function tbRowsFlat() {
  const cols = COL_KEYS.filter((k) => TB.show[k]);
  const rows = [];
  TB.groups.forEach((g) => g.rows.forEach((r) => rows.push({ color: g.color, cells: cols.map((k) => PEOPLE_COLS.includes(k) ? r[k].map(chipLabel).join(", ") : (r[k] || "")) })));
  return { cols, head: cols.map((k) => TB.cols[k]), rows };
}
function tbCopyText(btn) {
  const { head, rows } = tbRowsFlat();
  const text = [head.join(" | "), ...rows.map((r) => r.cells.map((c) => c || "—").join(" | "))].join("\n");
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).catch(() => {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  });
  const old = btn.textContent; btn.textContent = tt("copied"); setTimeout(() => (btn.textContent = old), 1500);
}
function tbImage() {
  const { head, rows } = tbRowsFlat();
  const S = 2, pad = 8, lineH = 20, font = '15px "Noto Sans TC","Noto Sans KR","Noto Sans",Arial,sans-serif', bold = 'bold ' + font;
  const cv = document.createElement("canvas"), g = cv.getContext("2d");
  const maxW = [230, 110, 150, 330, 330, 260];
  g.font = font;
  const widths = head.map((h, i) => {
    g.font = bold; let w = g.measureText(h).width;
    g.font = font; rows.forEach((r) => { w = Math.max(w, Math.min(g.measureText(r.cells[i]).width, maxW[i] || 300)); });
    return Math.ceil(Math.min(w, maxW[i] || 300) + pad * 2);
  });
  const wrap = (text, w) => {
    g.font = font; const out = []; let line = "";
    for (const word of String(text).split(/\s+/)) {
      const tryL = line ? line + (line.endsWith(",") ? " " : " ") + word : word;
      if (g.measureText(tryL).width <= w || !line) line = tryL; else { out.push(line); line = word; }
    }
    if (line) out.push(line); return out.length ? out : [""];
  };
  const lines = rows.map((r) => r.cells.map((c, i) => wrap(c, widths[i] - pad * 2)));
  const heights = lines.map((ls) => Math.max(...ls.map((l) => l.length)) * lineH + pad * 2);
  const headH = lineH + pad * 2, W = widths.reduce((a, b) => a + b, 0) + 1, H = headH + heights.reduce((a, b) => a + b, 0) + 1;
  cv.width = W * S; cv.height = H * S; g.scale(S, S);
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H); g.strokeStyle = "#9a9a9a"; g.lineWidth = 1; g.textBaseline = "top";
  let x = 0.5;
  head.forEach((h, i) => { g.font = bold; g.fillStyle = "#000"; g.fillText(h, x + pad, pad + 2); g.strokeRect(x, 0.5, widths[i], headH); x += widths[i]; });
  let y = headH + 0.5;
  rows.forEach((r, ri) => {
    x = 0.5;
    r.cells.forEach((c, i) => {
      g.fillStyle = r.color; g.fillRect(x, y, widths[i], heights[ri]);
      g.strokeRect(x, y, widths[i], heights[ri]);
      g.font = font; g.fillStyle = "#111";
      lines[ri][i].forEach((l, li) => g.fillText(l, x + pad, y + pad + 2 + li * lineH));
      x += widths[i];
    });
    y += heights[ri];
  });
  const url = cv.toDataURL("image/png");
  const m = document.createElement("div");
  m.className = "tb-modal";
  m.innerHTML = `<div class="card"><img src="${url}" style="max-width:100%;display:block;border-radius:6px">
    <div class="muted" style="margin:8px 0">${esc(tt("saveHint"))}</div>
    <div class="row"><a class="btn" download="battle-table.png" href="${url}">${esc(tt("download"))}</a>
    <button class="btn primary" data-topost="1">${esc(tt("toPost"))}</button>
    <button class="btn" data-close="1">${esc(tt("close"))}</button></div></div>`;
  m.onclick = (e) => {
    if (e.target === m || e.target.dataset.close) m.remove();
    if (e.target.dataset.topost) { try { sessionStorage.setItem("nxs-carry-img", url); } catch (err) {} location.href = "post-k4m8q2.html"; }
  };
  document.body.appendChild(m);
}

(function tbInit() {
  const host = $("tbCard");
  host.addEventListener("click", tbClick);
  host.addEventListener("input", (e) => { if (e.target.type !== "checkbox") tbInput(e); });
  host.addEventListener("change", (e) => { if (e.target.type === "checkbox") tbInput(e); else if (e.target.dataset.set || e.target.dataset.col || e.target.dataset.rolecount !== undefined) tbRender(); });
  host.addEventListener("dragstart", tbDragStart);
  host.addEventListener("dragover", (e) => { if (e.target.closest(".tb-cell")) e.preventDefault(); });
  host.addEventListener("drop", tbDrop);
})();

officerGate(init);

// coming back to this tab with the browser's Back button: follow a language change made on another tab
window.addEventListener("pageshow", (e) => { if (e.persisted && officerLang() && officerLang() !== lang) location.reload(); });
</script>
