<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  body { padding: 16px; }

  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .btn { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--panel); color: var(--text); cursor: pointer; font-size: 14px; }
  .btn.mini { padding: 2px 7px; font-size: 13px; }
  .btn:disabled { opacity: .5; cursor: default; }
  a.btn { text-decoration: none; display: inline-block; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .card { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 14px; margin: 14px 0; box-shadow: 0 4px 14px var(--shadow); }
  .card h2 { margin: 0 0 10px; font-size: 18px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=search], input[type=number] { box-sizing: border-box; padding: 8px 10px; font-size: 15px; border-radius: 8px; border: 1px solid var(--rule); background: var(--panel-2); color: var(--text); }
  input[type=search] { flex: 1; min-width: 160px; }
  input[type=number] { width: 70px; }
  .tbl-wrap { overflow: auto; margin-top: 10px; max-height: 70vh; border: 1px solid var(--rule); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; text-align: start; vertical-align: top; }
  th { position: sticky; top: 0; background: var(--panel-2); z-index: 1; cursor: pointer; user-select: none; }
  td.num, th.num { text-align: end; font-variant-numeric: tabular-nums; }
  td.wrapc { white-space: normal; min-width: 160px; max-width: 260px; }
  .name { font-weight: 600; }
  .id { font-size: 12px; opacity: .65; font-variant-numeric: tabular-nums; user-select: all; }
  .flag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; margin: 1px 2px 1px 0; background: color-mix(in srgb, var(--accent) 22%, var(--panel)); border: 1px solid var(--accent); }

  .flag.ok { background: color-mix(in srgb, #66bb6a 25%, var(--panel)); border-color: #66bb6a; }

  .tabs a { padding: 9px 14px; border-radius: 10px 10px 0 0; text-decoration: none; color: var(--text-muted); font-weight: 600; border: 1px solid transparent; border-bottom: 0; }
  .tabs a.on { color: var(--text); background: var(--panel); border-color: var(--rule); margin-bottom: -2px; border-bottom: 2px solid var(--panel); }
  @media (max-width: 440px) { .tabs { gap: 0; flex-wrap: nowrap; overflow-x: auto; } .tabs a { padding: 8px 6px; font-size: 13px; white-space: nowrap; } }
  .msg { margin-top: 6px; font-size: 13px; }
  .warn { color: var(--accent); }
  .empty { padding: 20px; text-align: center; color: var(--text-muted); }
  ul.notes { margin: 6px 0 0; padding-inline-start: 20px; font-size: 13px; color: var(--text-muted); }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; z-index: 50; }
  .modal .card { max-width: 420px; width: 100%; box-sizing: border-box; }
  .modal label.f { display: block; font-weight: 600; margin: 12px 0 4px; }
  .modal textarea, .modal input[type=text] { width: 100%; box-sizing: border-box; padding: 9px 11px; font-size: 15px; border-radius: 8px; border: 1px solid var(--rule); background: var(--panel-2); color: var(--text); font-family: inherit; }
  .modal textarea { min-height: 90px; line-height: 1.5; }
  .modal .seg label { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 8px; cursor: pointer; font-size: 14px; }

        <label class="row" style="font-size:14px;flex:1;min-width:220px"><span data-t="farmsL"></span> <input type="search" id="farms" style="flex:1"></label>
      </div>
      <div class="tbl-wrap">

          <thead><tr id="head"></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

    <div class="card">

      <div class="tbl-wrap" style="max-height:40vh">

          <tbody id="left"></tbody>
        </table>
      </div>
    </div>

</div>

<script>
const T = {

    exportNote: "會複製下面顯示的所有成員，包含幹部填的「Clear」和「Why / comments」。",

    members: "成員", onlyFlag: "只顯示有標記的人", newDays: "「新成員」＝幾天內加入",
    search: "搜尋名字或 ID…",
    colName: "名字", colRank: "階級", colPower: "戰力", colPowerD: "戰力變化", colKills: "擊殺", colKillsD: "擊殺變化", colTc: "主城",
    colKid: "王國", colLang: "語言", colSince: "加入 NXS", colFrom: "曾出現在其他聯盟", colNames: "之前的名字",
    colSimilar: "其他聯盟的相似名字", colLogin: "上次登入", colFlags: "標記", colClear: "Clear", colWhy: "Why / comments",
    before: "{d} 以前", between: "{a} 到 {b} 之間", leftTitle: "已離開 NXS", colLeft: "離開日期", colNow: "之後出現在",
    fNew: "新成員（{n} 天）", fKid: "來自王國 {k}", fRenamed: "改過名", fFrom: "待過 {t}", fSimilar: "{t} 有相似名字",
    fDrop: "戰力下降", noData: "還沒有資料。到 GitHub → Actions →「Update Roster (MightPulse)」執行一次後重新整理。",
    updated: "更新：{t} · 紀錄從 {s} 開始", empty: "沒有符合的成員。",
    n1: "紀錄從 {s} 開始。「{s} 以前」表示開始追蹤時就已經在 NXS。",
    n2: "「曾出現在其他聯盟」來自其他聯盟的成員名單。MightPulse 有時只有舊的名單，所以會標出那份名單的日期。",
    n3: "戰力／擊殺變化＝已存資料中最近 {d} 天的變化。",
    n4: "標記只是提醒可以多看哪裡，不代表任何證據。",
    n5: "聯盟和改名紀錄也包含 {d} 從 MightPulse Record 抓下來的資料。",
    n6: "Clear／Why 所有幹部共用，按 ✏️ 編輯。",
    fCleared: "已確認", fNotClear: "有疑慮", csNone: "未確認",
    yourName: "你的名字", saveBtn: "儲存", cancel: "取消", saving: "儲存中…",
    errAuth: "存的 GitHub 權杖已經不能用了（可能過期）。請到 Post 分頁重新設定。",
    errBusy: "剛好有人也在存備註，請再試一次。", errNet: "連不上 GitHub，請檢查網路後再試一次。",
  },
};
const KID = 2189, TAG = "NXS";
const LS = "nxs-watch-v1";
const store = (() => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } })();
const save = () => { try { localStorage.setItem(LS, JSON.stringify(store)); } catch (e) {} };
let lang = store.lang || "en";
let newDays = store.newDays || 14;
let rivals = store.rivals ?? "RED, ESA, NBD";
let farms = store.farms ?? "nxs, VZP";
const tagList = (s) => String(s).split(/[,\s]+/).map((x) => x.trim()).filter(Boolean);
const tagOf = (t) => t.replace(/ \(#\d+\)$/, "");
let sortKey = "flags", sortDir = -1;
let roster = null, watch = null, records = null, rows = [];

const $ = (id) => document.getElementById(id);
const tr = (k, v = {}) => String((T[lang] && T[lang][k]) ?? T.en[k] ?? k).replace(/\{(\w+)\}/g, (m, x) => v[x] ?? m);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const big = (n) => n == null ? "" : Math.abs(n) >= 1e9 ? (n / 1e9).toFixed(2) + "B" : Math.abs(n) >= 1e6 ? (n / 1e6).toFixed(1) + "M" : Math.abs(n) >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(n);
const core = (s) => String(s || "").normalize("NFKC").toLowerCase().replace(/nexus/g, "").replace(/[亗卍〆『』「」【】〖〗★☆♛♚♕✿❀•·]/g, "").replace(/[^\p{L}\p{N}]/gu, "");
const toDate = (v) => { if (v == null || v === "") return ""; const ms = typeof v === "number" ? (v < 1e12 ? v * 1000 : v) : Date.parse(v); return isNaN(ms) ? "" : new Date(ms).toISOString().slice(0, 10); };
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);

/* ===== shared notes (data/notes-x7k2p9.json), written with the officers' GitHub key ===== */
const OWNER = location.hostname.endsWith("github.io") ? location.hostname.split(".")[0] : "NXSguides";
const REPO = location.hostname.endsWith("github.io") ? (location.pathname.split("/")[1] || "Kingshot_guideline_NXS") : "Kingshot_guideline_NXS";
const BRANCH = "main", NOTES_PATH = "data/notes-x7k2p9.json";
let TOKEN = null, notes = {};
const b64enc = (bytes) => { let s = ""; const u = new Uint8Array(bytes); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(s); };
const b64dec_ = (b64) => Uint8Array.from(atob(b64.replace(/\s/g, "")), (c) => c.charCodeAt(0));
const utf8ToB64 = (str) => b64enc(new TextEncoder().encode(str));
const b64ToUtf8 = (b64) => new TextDecoder().decode(b64dec_(b64));
async function gh(method, path, body) {
  let res;
  try {
    res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}${method === "GET" ? "?ref=" + BRANCH + "&t=" + Date.now() : ""}`, {
      method, headers: { Authorization: `Bearer ${TOKEN}`, Accept: "application/vnd.github+json" },
      body: body ? JSON.stringify(body) : undefined, cache: "no-store",
    });
  } catch (e) { throw new Error("net"); }
  if (res.status === 401 || res.status === 403) throw new Error("auth");
  if (res.status === 409 || res.status === 422) throw new Error("busy");
  if (method === "GET" && res.status === 404) return null;
  if (!res.ok) throw new Error("net");
  return res.json();
}
const errText = (e) => tr(e.message === "auth" ? "errAuth" : e.message === "busy" ? "errBusy" : "errNet");
async function loadNotes() {
  if (TOKEN) { try { const f = await gh("GET", NOTES_PATH); notes = f ? JSON.parse(b64ToUtf8(f.content)) : {}; return; } catch (e) {} }
  try { const r = await fetch(NOTES_PATH + "?t=" + Date.now(), { cache: "no-store" }); notes = r.ok ? await r.json() : {}; } catch (e) { notes = {}; }
}
async function saveNote(id, note) {
  for (let attempt = 0; attempt < 2; attempt++) {
    const f = await gh("GET", NOTES_PATH);
    const cur = f ? JSON.parse(b64ToUtf8(f.content)) : {};
    if (note) cur[id] = note; else delete cur[id];
    try {
      await gh("PUT", NOTES_PATH, { message: `Watch note: ${id}`, content: utf8ToB64(JSON.stringify(cur, null, 1) + "\n"), sha: f ? f.sha : undefined, branch: BRANCH });
      notes = cur; return;
    } catch (e) { if (e.message !== "busy" || attempt) throw e; }
  }
}
function editNote(r) {
  const n = notes[r.id] || {};
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="card">
    <h2 dir="auto" style="margin-bottom:2px">${esc(r.name)}</h2><div class="id">ID ${esc(r.id)}</div>
    <label class="f">${esc(tr("colClear"))}</label>
    <div class="row seg">
      <label><input type="radio" name="cs" value=""> ${esc(tr("csNone"))}</label>
      <label><input type="radio" name="cs" value="yes"> ✅ ${esc(tr("fCleared"))}</label>
      <label><input type="radio" name="cs" value="no"> ⚠️ ${esc(tr("fNotClear"))}</label>
    </div>
    <label class="f">${esc(tr("colWhy"))}</label><textarea id="nWhy" dir="auto"></textarea>
    <label class="f">${esc(tr("yourName"))}</label><input type="text" id="nBy" maxlength="40">
    <div class="msg warn" id="nErr" hidden></div>
    <div class="row" style="justify-content:flex-end;margin-top:12px">
      <button class="btn" id="nCancel">${esc(tr("cancel"))}</button>
      <button class="btn primary" id="nSave">${esc(tr("saveBtn"))}</button>
    </div></div>`;
  document.body.appendChild(m);
  m.querySelector(`input[name=cs][value="${n.clear || ""}"]`).checked = true;
  m.querySelector("#nWhy").value = n.why || "";
  m.querySelector("#nBy").value = officerStore().author || "";
  const close = () => m.remove();
  m.onclick = (e) => { if (e.target === m) close(); };
  m.querySelector("#nCancel").onclick = close;
  m.querySelector("#nSave").onclick = async () => {
    const clear = m.querySelector("input[name=cs]:checked").value;
    const why = m.querySelector("#nWhy").value.trim(), by = m.querySelector("#nBy").value.trim();
    const s = officerStore(); s.author = by; try { localStorage.setItem(OFFICER_LS, JSON.stringify(s)); } catch (e) {}
    const btn = m.querySelector("#nSave"); btn.disabled = true; btn.textContent = tr("saving");
    try {
      await saveNote(String(r.id), clear || why ? { clear, why, by, at: new
