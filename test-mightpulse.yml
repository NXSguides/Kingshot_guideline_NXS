name: Test MightPulse API
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/test-mightpulse.js
        env:
          MIGHTPULSE_API_KEY: ${{ secrets.MIGHTPULSE_API_KEY }}
