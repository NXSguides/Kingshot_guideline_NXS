<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NXS Officer</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

<style>
  body { padding: 16px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-family: "Oswald", "Noto Sans TC", sans-serif; margin: 0 0 4px; font-size: 26px; }
  .muted { color: var(--text-muted); font-size: 13px; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .btn { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--panel); color: var(--text); cursor: pointer; font-size: 14px; }
  a.btn { text-decoration: none; display: inline-block; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .btn.small { padding: 4px 9px; font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 14px; margin: 14px 0; box-shadow: 0 4px 14px var(--shadow); }
  .card h2 { margin: 0 0 10px; font-size: 18px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tabs { display: flex; gap: 6px; margin: 14px 0 0; border-bottom: 2px solid var(--rule); flex-wrap: wrap; }
  .tabs a { padding: 9px 14px; border-radius: 10px 10px 0 0; text-decoration: none; color: var(--text-muted); font-weight: 600; border: 1px solid transparent; border-bottom: 0; }
  .tabs a.on { color: var(--text); background: var(--panel); border-color: var(--rule); margin-bottom: -2px; border-bottom: 2px solid var(--panel); }
  @media (max-width: 440px) { .tabs { gap: 0; flex-wrap: nowrap; overflow-x: auto; } .tabs a { padding: 8px 6px; font-size: 13px; white-space: nowrap; } }
  .weeknav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .weeknav .lbl { font-weight: 700; text-align: center; flex: 1; }
  .day { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--rule); }
  .day:last-child { border-bottom: 0; }
  .day.today { background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 8px; padding-inline: 6px; }
  .dname { font-weight: 700; line-height: 1.2; }
  .dname small { display: block; font-weight: 400; color: var(--text-muted); font-size: 12px; }
  .ev { display: inline-flex; align-items: center; gap: 4px; margin: 2px 6px 2px 0; padding: 3px 9px; border-radius: 999px; font-size: 13px; border: 1px solid var(--rule); background: var(--panel-2); }
  .ev.start { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 20%, var(--panel)); font-weight: 700; }
  .ev .n { font-size: 11px; color: var(--text-muted); }
  .none { color: var(--text-muted); font-size: 13px; }
  .todo { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 10px; background: var(--panel-2); margin: 8px 0; }
  .todo input { width: 20px; height: 20px; margin-top: 2px; flex: none; }
  .todo.done .txt { opacity: .55; text-decoration: line-through; }
  .todo .when { font-size: 12px; color: var(--text-muted); }
  .todo .acts { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .msg { margin-top: 6px; font-size: 13px; }
  .warn { color: var(--accent); }
  [hidden] { display: none !important; }
  .ev { cursor: pointer; }
  .evrow { border-bottom: 1px solid var(--rule); padding: 8px 0; }
  .evrow:last-child { border-bottom: 0; }
  .evrow > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .evrow > summary::-webkit-details-marker { display: none; }
  .sched { font-size: 12px; color: var(--text-muted); font-weight: 400; }
  .evrow.flash { animation: flash 1.6s; }
  @keyframes flash { 0%, 40% { background: color-mix(in srgb, var(--accent) 25%, transparent); } 100% { background: transparent; } }
  .ig { background: var(--panel-2); border-radius: 10px; padding: 10px; margin: 8px 0; }
  .ig .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 6px; }
  .ig .head .btn { white-space: nowrap; flex: none; }
  .ig pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-family: inherit; font-size: 14px; line-height: 1.45; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; overflow-y: auto; padding: 16px; }
  .modal .card { max-width: 640px; margin: 10px auto 40px; }
  label.f { display: block; font-weight: 600; margin: 12px 0 4px; font-size: 14px; }
  label.f small { font-weight: 400; color: var(--text-muted); }
  .inp, .modal select, .modal textarea { width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 15px; border-radius: 8px; border: 1px solid var(--rule); background: var(--panel-2); color: var(--text); font-family: inherit; }
  .modal textarea { min-height: 160px; line-height: 1.45; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end; }
  .grid2 { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px; }
  .grid3 > div, .grid2 > div { min-width: 0; }
  .inp { display: block; min-width: 0; max-width: 100%; }
  .datebox { position: relative; display: flex; gap: 6px; align-items: center; }
  .datebox .inp { flex: 1; }
  .datebox .btn { flex: none; }
  #edPicker { position: absolute; right: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; pointer-events: none; }
  @media (max-width: 520px) { .grid3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .grid3 > div:first-child { grid-column: 1 / -1; } }
  .todo-ed .due { display: flex; align-items: center; gap: 8px; font-size: 13px; flex-wrap: wrap; }
  .todo-ed .due .inp { width: 80px; }
  .sub { border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px; margin: 8px 0; }
  .sub .row { justify-content: space-between; }
  .okmsg { color: #2e7d32; }

  #pg-post .btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--rule); background: var(--panel); color: var(--text); cursor: pointer; font-size: 15px; text-decoration: none; display: inline-block; }
  #pg-post .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  #pg-post .btn.big { width: 100%; padding: 14px; font-size: 17px; }
  #pg-post .btn.danger { color: #b3261e; border-color: #b3261e; }
  #pg-post .btn:disabled { opacity: .5; cursor: default; }

  #pg-post textarea { min-height: 200px; line-height: 1.5; }

  #pg-post .msg { margin-top: 10px; padding: 10px 12px; border-radius: 8px; display: none; line-height: 1.5; }
  #pg-post .msg.ok { display: block; background: color-mix(in srgb, #2e7d32 15%, transparent); }
  #pg-post .msg.err { display: block; background: color-mix(in srgb, #b3261e 15%, transparent); }
  #pg-post .msg.info { display: block; background: var(--panel-2); }
  #pg-post .ann { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  #pg-post .ann:last-child { border-bottom: 0; }
  #pg-post .ann b { display: block; }
  #pg-post .steps { margin: 6px 0 0; padding-inline-start: 22px; line-height: 1.6; }
  #pg-post .tip { font-size: 13px; color: var(--text-muted); margin-top: 6px; }
  #pg-post details summary { cursor: pointer; font-weight: 600; }
  #pg-post .tabs { display: flex; gap: 6px; margin: 14px 0 0; border-bottom: 2px solid var(--rule); }
  #pg-post .tabs a { padding: 9px 14px; border-radius: 10px 10px 0 0; text-decoration: none; color: var(--text-muted); font-weight: 600; border: 1px solid transparent; border-bottom: 0; }
  #pg-post .tabs a.on { color: var(--text); background: var(--panel); border-color: var(--rule); margin-bottom: -2px; border-bottom: 2px solid var(--panel); }
  @media (max-width: 440px) {
  #pg-post .tabs { gap: 0; flex-wrap: nowrap; overflow-x: auto; }
  #pg-post .tabs a { padding: 8px 6px; font-size: 13px; white-space: nowrap; } }
  #pg-post .preview img { max-width: 100%; border-radius: 8px; display: block; margin: 6px 0; }
  #pg-post .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; z-index: 50; }
  #pg-post .modal .card { max-width: 380px; width: 100%; }
  #pg-post [hidden] { display: none !important; }
  #pg-post .ann .acts { display: flex; gap: 6px; flex-shrink: 0; }
  #pg-post .badge { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 6px; background: var(--panel-2); margin-inline-start: 4px; }
  #pg-post .editing { background: color-mix(in srgb, var(--accent) 16%, transparent); border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; }

  #pg-watch .wrap { max-width: 1200px; margin: 0 auto; }
  #pg-watch h1 { font-family: "Oswald", "Noto Sans TC", sans-serif; margin: 0 0 4px; font-size: 26px; }
  #pg-watch .muted { color: var(--text-muted); font-size: 13px; }
  #pg-watch .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  #pg-watch .btn { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--panel); color: var(--text); cursor: pointer; font-size: 14px; }
  #pg-watch .btn.mini { padding: 2px 7px; font-size: 13px; }
  #pg-watch .btn:disabled { opacity: .5; cursor: default; }
  #pg-watch a.btn { text-decoration: none; display: inline-block; }
  #pg-watch .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  #pg-watch .card { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 14px; margin: 14px 0; box-shadow: 0 4px 14px var(--shadow); }
  #pg-watch .card h2 { margin: 0 0 10px; font-size: 18px; }
  #pg-watch .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  #pg-watch input[type=search], #pg-watch input[type=number] { box-sizing: border-box; padding: 8px 10px; font-size: 15px; border-radius: 8px; border: 1px solid var(--rule); background: var(--panel-2); color: var(--text); }
  #pg-watch input[type=search] { flex: 1; min-width: 160px; }
  #pg-watch input[type=number] { width: 70px; }
  #pg-watch .tbl-wrap { overflow: auto; margin-top: 10px; max-height: 70vh; border: 1px solid var(--rule); border-radius: 8px; }
  #pg-watch table { border-collapse: collapse; width: 100%; font-size: 13px; }
  #pg-watch th, #pg-watch td { padding: 6px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; text-align: start; vertical-align: top; }
  #pg-watch th { position: sticky; top: 0; background: var(--panel-2); z-index: 1; cursor: pointer; user-select: none; }
  #pg-watch td.num, #pg-watch th.num { text-align: end; font-variant-numeric: tabular-nums; }
  #pg-watch td.wrapc { white-space: normal; min-width: 160px; max-width: 260px; }
  #pg-watch .name { font-weight: 600; }
  #pg-watch .id { font-size: 12px; opacity: .65; font-variant-numeric: tabular-nums; user-select: all; }
  #pg-watch .flag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; margin: 1px 2px 1px 0; background: color-mix(in srgb, var(--accent) 22%, var(--panel)); border: 1px solid var(--accent); }
  #pg-watch .flag.hi { background: color-mix(in srgb, #e57373 25%, var(--panel)); border-color: #d77a72; }
  #pg-watch .flag.ok { background: color-mix(in srgb, #66bb6a 25%, var(--panel)); border-color: #66bb6a; }
  #pg-watch .up { color: #2e7d32; }
  #pg-watch .down { color: #c62828; }
  #pg-watch .tabs { display: flex; gap: 6px; margin: 14px 0 0; border-bottom: 2px solid var(--rule); flex-wrap: wrap; }
  #pg-watch .tabs a { padding: 9px 14px; border-radius: 10px 10px 0 0; text-decoration: none; color: var(--text-muted); font-weight: 600; border: 1px solid transparent; border-bottom: 0; }
  #pg-watch .tabs a.on { color: var(--text); background: var(--panel); border-color: var(--rule); margin-bottom: -2px; border-bottom: 2px solid var(--panel); }
  @media (max-width: 440px) {
  #pg-watch .tabs { gap: 0; flex-wrap: nowrap; overflow-x: auto; }
  #pg-watch .tabs a { padding: 8px 6px; font-size: 13px; white-space: nowrap; } }
  #pg-watch .msg { margin-top: 6px; font-size: 13px; }
  #pg-watch .warn { color: var(--accent); }
  #pg-watch .empty { padding: 20px; text-align: center; color: var(--text-muted); }
  #pg-watch ul.notes { margin: 6px 0 0; padding-inline-start: 20px; font-size: 13px; color: var(--text-muted); }
  #pg-watch .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; z-index: 50; }
  #pg-watch .modal .card { max-width: 440px; width: 100%; box-sizing: border-box; max-height: 90vh; overflow: auto; }
  #pg-watch .modal label.f { display: block; font-weight: 600; margin: 12px 0 4px; }
  #pg-watch .modal label.f small { font-weight: 400; color: var(--text-muted); }
  #pg-watch .modal textarea, #pg-watch .modal input[type=text] { width: 100%; box-sizing: border-box; padding: 9px 11px; font-size: 15px; border-radius: 8px; border: 1px solid var(--rule); background: var(--panel-2); color: var(--text); font-family: inherit; }
  #pg-watch .modal textarea { min-height: 70px; line-height: 1.5; }
  #pg-watch .modal .seg label { display: flex; align-items: center; gap: 4px; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 8px; cursor: pointer; font-size: 14px; }
  #pg-watch .modal hr { border: 0; border-top: 1px solid var(--rule); margin: 14px 0 0; }

  .pg[hidden] { display: none !important; }
  .shbar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap" id="main">
  <div class="shbar"><a class="btn" href="./">← <span id="shHome"></span></a><button class="btn" id="langBtn"></button></div>
  <nav class="tabs">
    <a href="#events" data-tab="events">📅 Events</a>
    <a href="#ranking" data-tab="ranking">📊 Ranking</a>
    <a href="#post" data-tab="post">📢 Post</a>
    <a href="#watch" data-tab="watch">🕵️ Watch</a>
  </nav>
  <div id="gate" class="card" hidden style="max-width:360px;margin:24px auto">
    <h2 id="gateTitle"></h2>
    <input type="password" id="gatePw" autocomplete="current-password" style="width:100%;box-sizing:border-box;padding:10px;font-size:16px;border-radius:8px;border:1px solid var(--rule);background:var(--panel-2);color:var(--text)">
    <label class="row" style="margin-top:8px;font-size:14px"><input type="checkbox" id="gateRemember" checked> <span id="gateRememberTxt"></span></label>
    <div style="margin-top:10px"><button class="btn primary" id="gateBtn" style="width:100%;padding:12px"></button></div>
    <div class="msg warn" id="gateErr" hidden></div>
  </div>
<section class="pg" id="pg-events" hidden>
  <div class="top">
    <div>
      <h1 data-t="title"></h1>
      <div class="muted" data-t="sub"></div>
    </div>
  </div>
  <div id="ev_noData" class="card" hidden></div>

  <div id="ev_app" hidden>
    <div class="card">
      <div class="weeknav">
        <button class="btn" id="prevW">◀</button>
        <div class="lbl" id="weekLbl"></div>
        <button class="btn" id="nextW">▶</button>
      </div>
      <div class="row" style="justify-content:center;margin-top:6px"><button class="btn small" id="thisW" data-t="thisWeek"></button></div>
    </div>

    <div class="card">
      <h2 data-t="todoTitle"></h2>
      <div id="todos"></div>
      <div class="muted msg" data-t="todoNote"></div>
    </div>

    <div class="card">
      <h2 data-t="weekTitle"></h2>
      <div id="days"></div>
      <div class="muted msg" data-t="note"></div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0" data-t="mgrTitle"></h2>
        <button class="btn primary small" id="addEv" data-t="addEv"></button>
      </div>
      <div class="muted msg" data-t="mgrNote"></div>
      <div id="evList"></div>
      <div class="msg" id="saveMsg"></div>
    </div>
  </div>

  <div class="modal" id="editor" hidden>
    <div class="card">
      <h2 id="edTitle"></h2>
      <div class="grid2">
        <div><label class="f" data-t="fEmoji"></label><input class="inp" id="edEmoji" maxlength="4"></div>
        <div><label class="f" data-t="fName"></label><input class="inp" id="edName" maxlength="60"></div>
      </div>
      <label class="f"><input type="checkbox" id="edFixed"> <span data-t="fFixed"></span></label>
      <div id="edSched" class="grid3">
        <div><label class="f" data-t="fStart"></label>
          <div class="datebox"><input class="inp" id="edStart" inputmode="numeric" placeholder="YYYY-MM-DD" maxlength="10" autocomplete="off"><button type="button" class="btn small" id="edPick">📅</button><input type="date" id="edPicker" tabindex="-1" aria-hidden="true"></div>
          <div class="sched" id="edStartTxt"></div></div>
        <div><label class="f" data-t="fEvery"></label><input class="inp" type="number" min="1" id="edEvery"></div>
        <div><label class="f" data-t="fDays"></label><input class="inp" type="number" min="1" id="edDays"></div>
      </div>
      <label class="f"><span data-t="fNote"></span> <small data-t="fNoteSm"></small></label><input class="inp" id="edNote" maxlength="120">
      <label class="f" data-t="fGuide"></label><select id="edGuide"></select>
      <label class="f" data-t="fTodo"></label>
      <div id="edTodos"></div>
      <button class="btn small" id="edAddTodo" data-t="addTodo"></button>
      <label class="f"><span data-t="fIngame"></span> <small data-t="fIngameSm"></small></label>
      <div id="edIgs"></div>
      <button class="btn small" id="edAddIg" data-t="addIg"></button>
      <div class="row" style="margin-top:16px;justify-content:space-between">
        <button class="btn" id="edDel" data-t="del" style="color:#b3261e;border-color:#b3261e"></button>
        <div class="row"><button class="btn" id="edCancel" data-t="cancel"></button><button class="btn primary" id="edSave" data-t="save"></button></div>
      </div>
      <div class="msg warn" id="edMsg"></div>
    </div>
  </div>
</section>
<section class="pg" id="pg-ranking" hidden>
  <div class="top">
    <div>
      <h1 data-t="title"></h1>
      <div class="muted" id="rk_meta"></div>
    </div>
  </div>
  <div id="rk_noData" class="card" hidden></div>

  <div id="rk_app" hidden>
    <!-- 1. weights -->
    <div class="card">
      <h2 data-t="weights"></h2>
      <div class="row">
        <label class="w"><span data-t="power"></span><input type="number" id="wPower" min="0" max="100" step="5"> %</label>
        <label class="w"><span data-t="mystic"></span><input type="number" id="wMystic" min="0" max="100" step="5"> %</label>
      </div>
      <div class="muted msg" data-t="weightNote"></div>
    </div>

    <!-- 2. pick participants -->
    <div class="card">
      <h2><span data-t="pick"></span> <span class="muted" id="pickCount"></span></h2>
      <div class="row" style="margin-bottom:8px">
        <button class="btn" id="allBtn" data-t="all"></button>
        <button class="btn" id="noneBtn" data-t="none"></button>
      </div>
      <details style="margin-bottom:8px">
        <summary data-t="paste"></summary>
        <div class="muted msg" data-t="pasteNote"></div>
        <textarea id="pasteBox"></textarea>
        <div class="row" style="margin-top:6px"><button class="btn" id="pasteBtn" data-t="pasteGo"></button></div>
        <div class="msg" id="pasteMsg"></div>
      </details>
      <input type="search" id="rk_q">
      <div class="tbl-wrap">
        <table>
          <thead><tr>
            <th></th>
            <th data-sort="name" data-t="colName"></th>
            <th data-sort="rank" data-t="colRank"></th>
            <th data-sort="tc" class="num" data-t="colTc"></th>
            <th data-sort="power" class="num" data-t="power"></th>
            <th data-sort="mystic" class="num" data-t="mystic"></th>
          </tr></thead>
          <tbody id="rk_list"></tbody>
        </table>
      </div>
    </div>

    <!-- 3. result -->
    <div class="card">
      <div class="top">
        <h2 data-t="result"></h2>
        <button class="btn primary" id="rk_copyBtn" data-t="copy"></button>
      </div>
      <div class="tbl-wrap" style="max-height:none">
        <table>
          <thead><tr>
            <th class="num">#</th>
            <th data-t="colName"></th>
            <th class="num" data-t="colScore"></th>
            <th class="num" data-t="power"></th>
            <th class="num" data-t="mystic"></th>
          </tr></thead>
          <tbody id="result"></tbody>
        </table>
      </div>
      <div class="muted msg" data-t="scoreNote"></div>
    </div>

    <!-- 4. event presets -->
    <div class="card">
      <div class="top">
        <h2 data-t="events"></h2>
        <button class="btn primary" id="presetCopy" data-t="copy" hidden></button>
      </div>
      <div class="muted msg" data-t="eventsNote" style="margin:0 0 8px"></div>
      <div class="row" id="presetBtns"></div>
      <div class="row" id="presetCounts" style="margin-top:10px"></div>
      <div id="presetOut"></div>
    </div>

    <!-- 5. battle table -->
    <div class="card" id="tbCard"></div>
  </div>
</section>
<section class="pg" id="pg-post" hidden>
  <div class="top">
    <div>
      <h1 data-t="title"></h1>
      <div class="muted" data-t="subtitle"></div>
    </div>
  </div>

  <!-- admin setup (only needed once, by the site owner) -->
  <div class="card" id="setupCard" hidden>
    <h2>🛠️ <span data-t="setupTitle"></span></h2>
    <div class="muted" data-t="setupIntro"></div>
    <ol class="steps" id="setupSteps"></ol>
    <label class="f" data-t="token"></label>
    <input type="password" id="tok" placeholder="github_pat_…" autocomplete="off">
    <label class="f" data-t="newPw"></label>
    <input type="password" id="pw1" autocomplete="new-password">
    <label class="f" data-t="newPw2"></label>
    <input type="password" id="pw2" autocomplete="new-password">
    <div style="margin-top:12px"><button class="btn primary big" id="setupBtn" data-t="setupGo"></button></div>
    <div class="msg" id="setupMsg"></div>
  </div>

  <div id="po_app" hidden>
    <!-- 2. write -->
    <div class="card">
      <h2>✍️ <span data-t="writeTitle"></span></h2>
      <div class="editing" id="editBanner" hidden><span><span data-t="editing"></span>: <b dir="auto" id="editBannerTitle"></b></span><button class="btn" id="cancelEdit" data-t="cancelEdit"></button></div>

      <label class="f" data-t="fName"></label>
      <input type="text" id="author" maxlength="40">

      <label class="f"><span data-t="fLang"></span> <small data-t="fLangNote"></small></label>
      <select id="srcLang"></select>

      <label class="f" data-t="fTitle"></label>
      <input type="text" id="annTitle" maxlength="120">

      <label class="f"><span data-t="fBody"></span> <small data-t="fBodyNote"></small></label>
      <textarea id="body"></textarea>
      <div class="row" style="margin-top:8px">
        <label class="btn" for="imgPick">🖼️ <span data-t="addImg"></span></label>
        <input type="file" id="imgPick" accept="image/*" multiple hidden>
        <span class="muted" data-t="addImgNote"></span>
      </div>

      <label class="f"><span data-t="fLink"></span> <small data-t="fLinkNote"></small></label>
      <select id="guide"></select>

      <label class="f" data-t="preview"></label>
      <div class="preview" id="preview"></div>

      <div style="margin-top:14px"><button class="btn primary big" id="publishBtn" data-t="publish"></button></div>
      <div class="msg" id="pubMsg"></div>
    </div>

    <!-- edit -->
    <div class="card" id="editCard" hidden>
      <div class="top"><h2>✏️ <span data-t="editTitle"></span></h2><button class="btn" id="editClose" data-t="close"></button></div>
      <div><b dir="auto" id="editWhich"></b></div>
      <label class="f" data-t="editWhat"></label>
      <select id="editLang"></select>
      <div id="editAllBox">
        <p class="muted" data-t="editAllNote"></p>
        <button class="btn primary" id="editAllGo" data-t="editAllGo"></button>
      </div>
      <div id="editPicBox" hidden>
        <p class="muted" data-t="picNote"></p>
        <div class="row">
          <label class="btn" for="picPick">🖼️ <span data-t="addImg"></span></label>
          <input type="file" id="picPick" accept="image/*" multiple hidden>
        </div>
        <label class="f" data-t="picWhere"></label>
        <div class="row" style="font-size:15px">
          <label><input type="radio" name="picPos" value="end" checked> <span data-t="picEnd"></span></label>
          <label><input type="radio" name="picPos" value="top"> <span data-t="picTop"></span></label>
        </div>
        <label class="f" data-t="preview"></label>
        <div class="preview" id="picPreview" dir="auto"></div>
        <div style="margin-top:12px"><button class="btn primary" id="picSave" data-t="picSave"></button></div>
      </div>
      <div id="editOneBox" hidden>
        <p class="muted" data-t="editLangNote"></p>
        <label class="f" data-t="fName"></label>
        <input type="text" id="fixBy" maxlength="40">
        <label class="f" data-t="fTitle"></label>
        <input type="text" id="fixTitle" maxlength="120" dir="auto">
        <label class="f" data-t="fBody"></label>
        <textarea id="fixBody" dir="auto"></textarea>
        <label class="f" data-t="preview"></label>
        <div class="preview" id="fixPreview" dir="auto"></div>
        <div class="row" style="margin-top:12px">
          <button class="btn primary" id="fixSave" data-t="saveFix"></button>
          <button class="btn" id="fixUndo" data-t="unfix" hidden></button>
        </div>
      </div>
      <div class="msg" id="editMsg"></div>
    </div>

    <!-- 3. current -->
    <div class="card">
      <div class="top">
        <h2>📋 <span data-t="listTitle"></span></h2>
        <button class="btn" id="reloadBtn" data-t="reload"></button>
      </div>
      <div class="muted" data-t="listNote"></div>
      <div id="po_list"></div>
      <div class="msg" id="listMsg"></div>
    </div>

    <details class="card">
      <summary data-t="adminMore"></summary>
      <p class="muted" data-t="adminMoreNote"></p>
      <div class="row">
        <button class="btn" id="forgetBtn" data-t="forget"></button>
        <button class="btn" id="resetupBtn" data-t="resetup"></button>
      </div>

/* ---- Times written as "08:00 UTC" / "UTC 08:00" (also ranges like 12:00–22:00 UTC) get the reader's own
   local time added after them, from the browser's time zone — e.g. "08:00 UTC (16:00 local)".
   Nothing is added when the reader is already on UTC. ---- */
const LT_LABEL = { en:"local", zh:"當地", ko:"현지", de:"Ortszeit", fr:"heure locale", pt:"local", es:"local", tr:"yerel", id:"lokal", ru:"местное", th:"ท้องถิ่น", ar:"محلي" };
function localTimes(html, lang) {
  const off = -new Date().getTimezoneOffset();          // minutes east of UTC
  if (!off) return html;
  const conv = (hm) => {
    const [h, m] = hm.split(":").map(Number);
    let t = h * 60 + m + off, day = 0;
    if (t < 0) { t += 1440; day = -1; } else if (t >= 1440) { t -= 1440; day = 1; }
    return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0") + (day ? (day > 0 ? "⁺¹" : "⁻¹") : "");
  };
  const label = LT_LABEL[lang] || LT_LABEL.en;
  // one time, a range (12:00–22:00) or a list (11:00 & 22:00 / 11:00 和 22:00) next to the word UTC
  const T = "\\d{1,2}:\\d{2}", SEP = "\\s*(?:[–\\-,/]|&amp;|&|和|and)\\s*";
  const G = `${T}(?:${SEP}${T})*`;
  const tag = (g) => ` <span class="lt">(${g.replace(/\d{1,2}:\d{2}/g, conv)} ${label})</span>`;
  return html
    .replace(new RegExp(`(${G})\\s*UTC(?![\\w+-])`, "g"), (m, g) => m + tag(g))
    .replace(new RegExp(`UTC\\s*(${G})(?!\\s*<span class="lt")`, "g"), (m, g) => m + tag(g));
}
/* ===== shared: language, password, tabs (the four pages below register themselves in OFFICER_PAGES) ===== */
const OFFICER_LANG = "nxs-officer-lang", OFFICER_LS = "nxs-post-v1";
const officerLang = () => { try { const v = localStorage.getItem(OFFICER_LANG); return v === "zh" || v === "en" ? v : null; } catch (e) { return null; } };
const setOfficerLang = (v) => { try { localStorage.setItem(OFFICER_LANG, v); } catch (e) {} };
const OFFICER = { lang: officerLang() || ((navigator.language || "").startsWith("zh") ? "zh" : "en"), token: null, pw: null };
const OFFICER_PAGES = {};
const TABS = ["events", "ranking", "post", "watch"];
const inited = {};
try { const th = localStorage.getItem("ks-theme"); if (th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th); } catch (e) {}
const SH = { en: { home: "Home", pw: "🔒 Officer password", remember: "Remember on this device", unlock: "Unlock", wrong: "Wrong password", loading: "Loading…" },
             zh: { home: "首頁", pw: "🔒 幹部密碼", remember: "在這台裝置記住", unlock: "解鎖", wrong: "密碼錯誤", loading: "載入中…" } };
function applyShared() {
  const t = SH[OFFICER.lang];
  document.documentElement.lang = OFFICER.lang === "zh" ? "zh-Hant" : "en";
  document.getElementById("shHome").textContent = t.home;
  document.getElementById("langBtn").textContent = OFFICER.lang === "zh" ? "English" : "中文";
  document.getElementById("gateTitle").textContent = t.pw;
  document.getElementById("gateRememberTxt").textContent = t.remember;
  document.getElementById("gateBtn").textContent = t.unlock;
  document.getElementById("gateErr").textContent = t.wrong;
}
document.getElementById("langBtn").onclick = () => {
  OFFICER.lang = OFFICER.lang === "zh" ? "en" : "zh";
  setOfficerLang(OFFICER.lang); applyShared();
  for (const k of TABS) {
    const p = OFFICER_PAGES[k];
    if (!p || !p.setLang) continue;
    try { p.setLang(OFFICER.lang); }                          // one tab failing must not stop the others
    catch (e) { console.error("setLang", k, e); try { p.applyTexts(); } catch (x) {} }
  }
};
const loadedScripts = {};
function loadScripts(list) {
  return list.reduce((p, src) => p.then(() => loadedScripts[src] || (loadedScripts[src] = new Promise((res, rej) => {
    const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error(src)); document.head.appendChild(s);
  }))), Promise.resolve());
}
/* tabs: #events / #ranking / #post / #watch (the part after "?" is kept for the page) */
function currentTab() { const m = (location.hash || "").match(/^#(events|ranking|post|watch)/); return m ? m[1] : "events"; }
async function showTab() {
  const k = currentTab();
  document.querySelectorAll(".tabs a").forEach((a) => a.classList.toggle("on", a.dataset.tab === k));
  for (const t of TABS) document.getElementById("pg-" + t).hidden = t !== k;
  const p = OFFICER_PAGES[k];
  if (!p) return;
  if (!inited[k]) { inited[k] = p.init(); }
  try { await inited[k]; } catch (e) { inited[k] = null; console.error(e); }
  if (p.onShow) p.onShow();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", showTab);
/* password: one check for all tabs; the GitHub key (for saving) and the data key (for reading) are opened here */
const b64dec_ = (b64) => Uint8Array.from(atob(b64.replace(/\s/g, "")), (c) => c.charCodeAt(0));
async function officerDecrypt(pw, blob) {
  try {
    const key = await OfficerData.pbkdf(pw, blob.salt, blob.iter, ["decrypt"]);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64dec_(blob.iv) }, key, b64dec_(blob.data)));
  } catch (e) { return null; }
}
function officerStore() { try { return JSON.parse(localStorage.getItem(OFFICER_LS)) || {}; } catch (e) { return {}; } }
async function officerGate() {
  let blob = await OfficerData.postKey();
  if (!blob) return showTab();                               // not set up yet → open (the Post tab shows the setup card)
  const checkPw = async (pw) => (await officerDecrypt(pw, blob)) || (await officerDecrypt(pw, blob = (await OfficerData.postKey(true)) || blob));
  const ok = async (pw, tok) => { OFFICER.pw = pw; OFFICER.token = tok; await OfficerData.unlock(pw); document.getElementById("gate").hidden = true; showTab(); };
  const st = officerStore(), tok = st.pw && await checkPw(st.pw);
  if (tok) return ok(st.pw, tok);
  const gate = document.getElementById("gate"), pwEl = document.getElementById("gatePw");
  gate.hidden = false;
  const go = async () => {
    const pw = pwEl.value, t = await checkPw(pw);
    if (t) {
      if (document.getElementById("gateRemember").checked) {
        const s = officerStore(); s.pw = pw; try { localStorage.setItem(OFFICER_LS, JSON.stringify(s)); } catch (e) {}
        window.dispatchEvent(new CustomEvent("nxs-officer-pw", { detail: pw }));   // the Post tab keeps its own copy of this record
      }
      ok(pw, t);
    } else { document.getElementById("gateErr").hidden = false; pwEl.value = ""; pwEl.focus(); }
  };
  document.getElementById("gateBtn").onclick = go;
  pwEl.onkeydown = (e) => { if (e.key === "Enter") go(); };
  pwEl.focus();
}
applyShared();

function defaultList(sched) {
  const out = [];
  for (const [id, e] of Object.entries(EVENTS)) {
    const s = sched[id];
    out.push({ id, emoji: e.emoji, en: e.en, zh: e.zh, start: s ? isoDay(s.anchor) : "", every: s ? s.periodDays : 0, days: s ? s.activeDays : 0,
      guide: e.noGuide ? "" : (GUIDE_LIST[id] ? id : ""), note: "", todo: (TODO[id] || []).map((x) => ({ ...x })), ingame: INGAME_DEFAULTS[id] || [] });
  }
  for (const e of EXTRA_EVENTS) if (!out.some((x) => x.id === e.id)) out.push({ ...e, note: e.note || "", todo: e.todo || [], ingame: INGAME_DEFAULTS[e.id] || [] });
  return out;
}

// every run of each scheduled event that touches [from, to)
function runs(from, to) {
  const out = [];
  for (const e of LIST) {
    if (!e.start || !(e.every > 0) || !(e.days > 0)) continue;
    const anchor = dayMs(e.start);
    let n = Math.max(0, Math.floor((from - anchor) / DAY / e.every) - 1);
    for (;; n++) {
      const st = anchor + n * e.every * DAY;
      if (st >= to) break;
      const en = st + e.days * DAY;
      if (en > from) out.push({ k: e.id, st, en, days: e.days });
    }
  }
  return out.sort((a, b) => a.st - b.st);
}

function render() {
  const ws = weekStart, we = ws + 7 * DAY, today = utcDay(Date.now());
  $("weekLbl").textContent = tr("week", { a: fmt(ws), b: fmt(we - DAY) });
  const rs = runs(ws, we);
  let html = "";
  for (let i = 0; i < 7; i++) {
    const d = ws + i * DAY;
    const on = rs.filter((r) => r.st <= d && d < r.en);
    html += `<div class="day${d === today ? " today" : ""}"><div class="dname">${esc(tr("wd")[i])}<small>${new Date(d).getUTCMonth() + 1}/${new Date(d).getUTCDate()}</small></div><div>${
      on.length ? on.map((r) => { const n = (d - r.st) / DAY + 1;
        const lbl = r.days === 1 ? "" : n === 1 ? tr("starts") : n === r.days ? tr("ends") : tr("day", { n, t: r.days });
        return `<span class="ev${n === 1 ? " start" : ""}" data-open="${esc(r.k)}">${esc(evName(r.k))}${lbl ? ` <span class="n">${esc(lbl)}</span>` : ""}</span>`; }).join("")
      : `<span class="none">${esc(tr("none"))}</span>`}</div></div>`;
  }
  $("days").innerHTML = html;

  const items = [];
  for (const r of runs(ws, we + 7 * DAY)) for (const [i, td] of ((byId(r.k) || {}).todo || []).entries()) {
    const due = r.st + (Number(td.due) || 0) * DAY;
    if (due < today) continue;   // past due → no longer listed
    const startsThisWeek = r.st >= ws && r.st < we, dueThisWeek = due >= ws && due < we;
    if (startsThisWeek || dueThisWeek) items.push({ r, td, due, id: `${r.k}-${isoDay(r.st)}-${i}` });
  }
  items.sort((a, b) => a.due - b.due);

  $("todos").innerHTML = items.length ? items.map(({ r, td, due, id }) => { const e = byId(r.k) || {};

      <div>
        <div class="txt"><b>${esc(evName(r.k))}</b> — ${localTimes(esc(txt(td)), lang)}</div>
        <div class="when">⏰ ${esc(fmt(due))}${due < today && !store.done[id] ? ` <b class="warn">${esc(tr("late"))}</b>` : ""} · ${esc(tr("runs", { a: fmt(r.st), b: fmt(r.en - DAY), n: r.days }))}</div>
        <div class="acts">${td.post ? `<a class="btn small" href="#post">${esc(tr("toPost"))}</a>` : ""}${td.ranking ? `<a class="btn small" href="#ranking">${esc(tr("toRanking"))}</a>` : ""}${e.guide ? `<a class="btn small" href="./#/${lang === "zh" ? "zh" : "en"}/${esc(e.guide)}">${esc(tr("toGuide"))}</a>` : ""}${(e.ingame || []).length ? `<button type="button" class="btn small" data-open="${esc(r.k)}">📋 ${esc(tr("fIngame"))}</button>` : ""}</div>

    </label>`; }).join("") : `<div class="none">${esc(tr("noTodo"))}</div>`;

  const maxM = Math.max(1, ...sel.map((m) => m.mystic || 0));
  const wp = wPower / 100, wm = 1 - wp;
  return sel.map((m) => ({ ...m, score: 100 * (wp * (m.power || 0) / maxP + wm * (m.mystic || 0) / maxM) }))
    .sort((a, b) => b.score - a.score);
}

function groupCount(pr, gi) {

}
function presetGroups(pr) {

  return pr.groups.map((g, gi) => {
    const c = g.count == null ? null : groupCount(pr, gi);
    const take = c == null ? r.slice(i) : r.slice(i, i + c); i += take.length; return { g, list: take };
  });
}

}

function persist() { store.picked = [...picked]; store.wPower = wPower; store.sortKey = sortKey; store.sortDir = sortDir; store.lang = lang; save(); }

/* ----- editing ----- */
function tbPut(gi, ri, k, chip) {
  const arr = TB.groups[gi].rows[ri][k];
  if (chip.kind === "p" && arr.some((x) => x.kind === "p" && String(x.id) === String(chip.id))) return;
  arr.push(chip);
}
function tbDraft() {
  const pr = PRESETS.find((x) => x.id === "swordland");
  const A = groupCount(pr, 0), D = groupCount(pr, 1);
  const r = ranking(); if (!r.length) return;
  const nG = Math.max(1, Math.min(A, r.length));
  const stage = listOf(TB.stages)[0] || "";
  TB.groups = Array.from({ length: nG }, (_, i) => ({ color: TB_COLORS[i % TB_COLORS.length], rows: [newRow(stage)] }));
  r.forEach((m, i) => {
    const chip = { kind: "p", id: m.id };
    if (i < nG) TB.groups[i].rows[0].att.push(chip);
    else if (i < nG + D) TB.groups[(i - nG) % nG].rows[0].def.push(chip);
    else TB.groups[(i - nG - D) % nG].rows[0].join.push(chip);
  });
}

function tbClick(e) {
  const t = e.target;
  // remove chip
  if (t.dataset.del) { const c = t.closest(".tb-chip"); TB.groups[c.dataset.g].rows[c.dataset.r][c.dataset.k].splice(c.dataset.x, 1); tbSave(); tbRender(); return; }
  // pick from pool
  const pc = t.closest(".tb-chip.pool");
  if (pc) { const id = pc.dataset.pid; tbPick = tbPick && tbPick.kind === "p" && String(tbPick.id) === String(id) ? null : { kind: "p", id: Number(id) || id }; tbRender(); return; }
  // add free text
  if (t.dataset.addtext) {
    const v = window.prompt(tt("textPrompt")); if (v && v.trim()) { tbPut(t.dataset.g, t.dataset.r, t.dataset.k, { kind: "t", text: v.trim() }); tbSave(); tbRender(); }
    return;
  }
  // put picked into a cell
  const cl = t.closest(".tb-cell");
  if (cl && tbPick) { tbPut(cl.dataset.g, cl.dataset.r, cl.dataset.k, tbPick); tbSave(); tbRender(); return; }
  // colour
  if (t.dataset.color) { TB.groups[t.dataset.g].color = t.dataset.color; tbSave(); tbRender(); return; }
  const a = t.closest("[data-act]"); if (!a) return;
  const gi = a.dataset.g, ri = a.dataset.r, act = a.dataset.act;
  if (act === "addGroup") TB.groups.push({ color: TB_COLORS[TB.groups.length % TB_COLORS.length], rows: [newRow(listOf(TB.stages)[0] || "")] });
  if (act === "delGroup") TB.groups.splice(gi, 1);
  if (act === "addRow") TB.groups[gi].rows.push(newRow(listOf(TB.stages)[0] || ""));
  if (act === "delRow") TB.groups[gi].rows.splice(ri, 1);
  if (act === "dupRow") { const r = JSON.parse(JSON.stringify(TB.groups[gi].rows[ri])); r.id = ++tbUid; TB.groups[gi].rows.splice(Number(ri) + 1, 0, r); }
  if (act === "clear") { if (!window.confirm(tt("confirmClear"))) return; TB.groups = []; }
  if (act === "draft") { if (TB.groups.length && !window.confirm(tt("confirmDraft"))) return; tbDraft(); }
  if (act === "image") return tbImage();
  if (act === "text") return tbCopyText(a);
  tbSave(); tbRender();
}
function tbInput(e) {
  const t = e.target;
  if (t.dataset.rolecount !== undefined) {
    const v = Math.max(0, Math.min(99, Math.round(Number(t.value) || 0)));
    store.counts = store.counts || {}; store.counts.swordland = store.counts.swordland || {};
    store.counts.swordland[t.dataset.rolecount] = v; save(); renderPresets(); return;

/* UTF-8 <-> base64 */
const b64enc = (bytes) => { let s = ""; const u = new Uint8Array(bytes); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(s); };
const b64dec = (b64) => Uint8Array.from(atob(b64.replace(/\s/g, "")), (c) => c.charCodeAt(0));
const utf8ToB64 = (str) => b64enc(new TextEncoder().encode(str));
const b64ToUtf8 = (b64) => new TextDecoder().decode(b64dec(b64));

/* password -> AES key (PBKDF2), token encrypted with AES-GCM */
const deriveKey = (pw, salt, iter) => OfficerData.pbkdf(pw, salt, iter, ["encrypt", "decrypt"]);   // shared + remembered across the officer tabs
async function encryptToken(token, pw) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 310000;
  const key = await deriveKey(pw, salt, iter);
  const data = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(token));
  return { v: 1, iter, salt: b64enc(salt), iv: b64enc(iv), data: b64enc(data) };
}
async function decryptToken(blob, pw) {
  const key = await deriveKey(pw, b64dec(blob.salt), blob.iter);
  const data = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64dec(blob.iv) }, key, b64dec(blob.data));
  return new TextDecoder().decode(data);
}

/* GitHub contents API */
async function gh(method, path, body, token = TOKEN) {
  let res;
  try {
    res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}${method === "GET" ? "?ref=" + BRANCH + "&t=" + Date.now() : ""}`, {
      method, headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" },
      body: body ? JSON.stringify(body) : undefined, cache: "no-store",
    });
  } catch (e) { throw new Error("net"); }
  if (res.status === 401 || res.status === 403) throw new Error("auth");
  if (res.status === 409 || res.status === 422) throw new Error("busy");
  if (method === "GET" && res.status === 404) return null;
  if (!res.ok) throw new Error("net");
  return res.json();
}
const errText = (e) => tr(e.message === "auth" ? "errAuth" : e.message === "busy" ? "errBusy" : "errNet");

/* read-modify-write of the source file, retried once if someone else changed it meanwhile */
async function editFile(path, change, message) {
  for (let attempt = 0; attempt < 2; attempt++) {
    const f = await gh("GET", path);           // null if the file doesn't exist yet
    const next = change(f ? b64ToUtf8(f.content) : "");
    try { return await gh("PUT", path, { message, content: utf8ToB64(next), sha: f ? f.sha : undefined, branch: BRANCH }); }
    catch (e) { if (e.message !== "busy" || attempt) throw e; }
  }
}

/* a JSON file from the repo (fresh); files over 1 MB come back without content, then read the site's copy */
async function readJson(path) {
  const f = await gh("GET", path);
  if (!f) return null;
  let txt = f.content ? b64ToUtf8(f.content) : "";
  if (!txt.trim() && f.size) txt = await (await fetch(path + "?t=" + Date.now(), { cache: "no-store" })).text();
  try { return txt.trim() ? JSON.parse(txt) : null; } catch (e) { return null; }
}
/* same id the translator gives a block: first 10 hex of sha1(JSON of the parsed block) */
async function blockId(block) {
  const h = await crypto.subtle.digest("SHA-1", new TextEncoder().encode(JSON.stringify(jsyaml.load(block))));
  return [...new Uint8Array(h)].map((x) => x.toString(16).padStart(2, "0")).join("").slice(0, 10);
}

/* ===== announcement blocks ===== */
const splitBlocks = (md) => md.replace(/\r/g, "").split(/^---$/m).map((s) => s.trim()).filter(Boolean);
const joinBlocks = (blocks) => "---\n" + blocks.join("\n---\n") + "\n";
function makeBlock({ author, lang, title, body, created }) {
  const content = body.replace(/\r/g, "").replace(/\t/g, "  ").replace(/^\s*\n/, "").trimEnd();
  const lines = content.split("\n").map((l) => (l.trim() ? "  " + l : ""));
  return [
    `author: ${JSON.stringify(author.trim())}`,
    ...(created ? [`created: ${JSON.stringify(created)}`] : []),   // an edited announcement keeps its first date
    `lang: ${lang}`,
    `title: ${JSON.stringify(title.trim())}`,
    `images: []`,
    `content: |`,
    ...lines,
  ].join("\n");
}
function fullBody() {
  const g = $("guide").value;
  return $("body").value.trimEnd() + (g ? `\n\n[[link:${g}]]` : "");
}

/* preview: same look as the site (game terms, bold, guide buttons) */
function term(id, lang) { const m = GLOSSARY[id]; return m ? (m[lang] || m.en || id) : null; }
function markup(title, body, lang) {
  const html = esc(body)
    .replace(/\{(\w+)\}/g, (m, id) => (term(id, lang) ? esc(term(id, lang)) : m))
    .replace(/\[\[link:([\w-]+)\]\]/g, (m, id) => GUIDES[id] ? `<span class="chip">${GUIDES[id].emoji} ${esc(GUIDES[id].name[lang] || GUIDES[id].name.en)} ›</span>` : "")
    .replace(/\[\[img:([\w./-]+)\]\]/g, (m, src) => `<img src="${pendingImgs[src] ? pendingImgs[src].url : picImgs[src] ? picImgs[src].url : esc(src)}" alt="">`)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  return (`<b>${esc(title)}</b>\n` + html).trim() || "…";
}

/* ===== pictures: shrunk on the phone, given a safe automatic file name, uploaded when publishing ===== */
let pendingImgs = {};   // path -> { blob, url }
let imgCounter = 0;
function shrink(file, maxSide = 1600) {
  return new Promise((resolve, reject) => {
    const img = new Image(); const src = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(src);
      c.toBlob((b) => (b ? resolve(b) : reject(new Error("image"))), "image/jpeg", 0.88);
    };
    img.onerror = () => reject(new Error("image"));
    img.src = src;
  });
}
function insertAtCursor(text) {
  const ta = $("body"), a = ta.selectionStart ?? ta.value.length, b = ta.selectionEnd ?? a;
  const before = ta.value.slice(0, a), after = ta.value.slice(b);
  const pre = before && !before.endsWith("\n") ? "\n" : "", post = after.startsWith("\n") ? "" : "\n";
  ta.value = before + pre + text + post + after;
  const pos = (before + pre + text + post).length; ta.setSelectionRange(pos, pos); ta.focus();
}
$("imgPick").onchange = async (e) => {
  const files = [...e.target.files]; e.target.value = "";
  const d = new Date(), stamp = d.toISOString().slice(0, 19).replace(/[-:]/g, "").replace("T", "-");
  for (const f of files) {
    try {
      const blob = await shrink(f);
      const path = `figures/ann/${stamp}-${++imgCounter}.jpg`;
      pendingImgs[path] = { blob, url: URL.createObjectURL(blob) };
      insertAtCursor(`[[img:${path}]]`);
    } catch (err) { showMsg("pubMsg", "err", "⚠️ " + f.name); }
  }
  renderPreview();
};

/* change one language's entry in the fixes file (value null = remove it); also drops fixes of announcements that no longer exist */
async function writeFix(id, lang, value, message) {
  const live = new Set(shownIds);
  await editFile(FIX_PATH, (txt) => {
    let o = {}; try { o = txt.trim() ? JSON.parse(txt) : {}; } catch (e) { o = {}; }
    for (const k of Object.keys(o)) if (!live.has(k) && k !== id) delete o[k];
    o[id] = o[id] || {};
    if (value) o[id][lang] = value; else delete o[id][lang];
    if (!Object.keys(o[id]).length) delete o[id];
    return JSON.stringify(o, null, 1) + "\n";
  }, message);
}

const picPos = () => (ROOT.querySelector('input[name="picPos"]:checked') || {}).value || "end";
/* put the picture lines at the top or the end (before a trailing guide button) of one text */
function withPics(text, paths, pos) {
  const lines = paths.map((p) => `[[img:${p}]]`).join("\n");
  let t = String(text || "").replace(/\s+$/, "");
  if (pos === "top") return lines + "\n\n" + t;

  if (m) return t.slice(0, m.index) + "\n\n" + lines + "\n\n" + m[1];
  return t + "\n\n" + lines;
}

/* GitHub git-data API (several files in ONE commit) */
async function git(method, path, body) {
  let res;
  try {
    res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/${path}`, {
      method, headers: { Authorization: `Bearer ${TOKEN}`, Accept: "application/vnd.github+json" },
      body: body ? JSON.stringify(body) : undefined, cache: "no-store",
    });
  } catch (e) { throw new Error("net"); }
  if (res.status === 401 || res.status === 403) throw new Error("auth");
  if (res.status === 409 || res.status === 422) throw new Error("busy");
  if (!res.ok) throw new Error("net");
  return res.json();
}
async function readText(path) {   // a text file from the repo ("" if missing); files over 1 MB come from the site's copy
  const f = await gh("GET", path);
  if (!f) return "";
  if (f.content) return b64ToUtf8(f.content);
  return f.size ? await (await fetch(path + "?t=" + Date.now(), { cache: "no-store" })).text() : "";
}
$("picSave").onclick = async () => {
  const paths = Object.keys(picImgs);
  if (!paths.length) { showMsg("editMsg", "err", tr("picNone")); return; }
  if (!(await askYesNo(tr("confirmPics")))) return;
  const pos = picPos(), btn = $("picSave"); btn.disabled = true; showMsg("editMsg", "info", tr("uploadingImg"));
  try {
    // the pictures become blobs first (they don't change anything until the commit)
    const imgShas = {};
    for (const p of paths) imgShas[p] = (await git("POST", "blobs", { content: b64enc(await picImgs[p].blob.arrayBuffer()), encoding: "base64" })).sha;
    showMsg("editMsg", "info", tr("savingFix"));
    let done = false;
    for (let attempt = 0; attempt < 3 && !done; attempt++) {
      const ref = await git("GET", "ref/heads/" + BRANCH);
      const head = ref.object.sha;
      const commit = await git("GET", "commits/" + head);
      const [srcF, cacheTxt, fixTxt] = await Promise.all([gh("GET", SOURCE_PATH), readText(CACHE_PATH), readText(FIX_PATH)]);
      const blocks = splitBlocks(b64ToUtf8(srcF.content));
      const at = blocks.indexOf(cur.block);
      if (at < 0) throw new Error("gone");
      const cache = cacheTxt.trim() ? JSON.parse(cacheTxt) : {};
      const old = cache[cur.id];
      if (!old || !old.content) throw new Error("notYet");
      const d = cur.d;
      const block = makeBlock({ author: d.author || "", lang: d.lang || "en", title: d.title || "", body: withPics(d.content, paths, pos), created: d.created || old.createdAt || "" });
      const newId = await blockId(block);
      blocks[at] = block;
      const entry = JSON.parse(JSON.stringify(old));
      for (const l of Object.keys(entry.content)) entry.content[l] = withPics(entry.content[l], paths, pos);
      entry.images = [...(entry.images || [])];
      const nextCache = {}; for (const [k, v] of Object.entries(cache)) nextCache[k === cur.id ? newId : k] = k === cur.id ? entry : v;
      const files = [
        { path: SOURCE_PATH, content: joinBlocks(blocks) },
        { path: CACHE_PATH, content: JSON.stringify(nextCache, null, 2) },
      ];
      if (fixTxt.trim()) {
        const fx = JSON.parse(fixTxt);
        if (fx[cur.id]) {
          const moved = JSON.parse(JSON.stringify(fx[cur.id]));
          for (const v of Object.values(moved)) if (v && typeof v.content === "string") v.content = withPics(v.content, paths, pos);
          delete fx[cur.id]; fx[newId] = moved;
          files.push({ path: FIX_PATH, content: JSON.stringify(fx, null, 1) + "\n" });
        }
      }
      const tree = await git("POST", "trees", { base_tree: commit.tree.sha, tree: [
        ...files.map((f) => ({ path: f.path, mode: "100644", type: "blob", content: f.content })),
        ...paths.map((p) => ({ path: p, mode: "100644", type: "blob", sha: imgShas[p] })),
      ] });
      const c = await git("POST", "commits", { message: `Add pictures to announcement: ${d.title || ""}`.slice(0, 120), tree: tree.sha, parents: [head] });
      try { await git("PATCH", "refs/heads/" + BRANCH, { sha: c.sha }); done = true; }
      catch (e) { if (e.message !== "busy") throw e; }   // someone else committed meanwhile: start again from the new state
    }
    if (!done) throw new Error("busy");
    Object.values(picImgs).forEach((x) => URL.revokeObjectURL(x.url)); picImgs = {};
    showMsg("editMsg", "ok", tr("picOk")); $("editPicBox").hidden = true; loadList();
  } catch (e) { showMsg("editMsg", "err", e.message === "gone" ? tr("gone") : e.message === "notYet" ? tr("notYet") : errText(e)); }
  btn.disabled = false;
};

async function tryUnlock(pw, silent, retried) {
  try { TOKEN = await decryptToken(keyBlob, pw); }
  catch (e) {
    // the key file remembered in this tab may be outdated (password changed) → try a fresh copy once
    if (!retried) { const fresh = await OfficerData.postKey(true); if (fresh && JSON.stringify(fresh) !== JSON.stringify(keyBlob)) { keyBlob = fresh; return tryUnlock(pw, silent, true); } }
    if (!silent) showMsg("lockMsg", "err", tr("wrongPw")); return false;
  }
  OFFICER_PW = pw; await OfficerData.unlock(pw);
  if ($("remember").checked || silent) { store.pw = pw; save(); }
  showApp(); return true;
}

    const recNames = [];
    let joinedRec = null;
    rec.forEach((e, i) => {
      if (e.a && e.d) { const t = `${e.a} (#${e.kid || KID})`; const r = seen[t]; seen[t] = r ? [r[0] < e.d ? r[0] : e.d, r[1] > e.d ? r[1] : e.d] : [e.d, e.d]; }
      if (e.name && !recNames.includes(e.name)) recNames.push(e.name);
      const inUs = e.a === TAG, prevIn = i > 0 && rec[i - 1].a === TAG;
      if (inUs && !prevIn) joinedRec = { d: e.d, first: i === 0 };
    });
    // history added by hand from the member's Record (same format as above)
    for (const x of note.alliances || []) {
      const t = `${x.a} (#${x.kid || KID})`, d = x.d || "", r = seen[t];
      seen[t] = r ? [!r[0] || (d && d < r[0]) ? d : r[0], d > r[1] ? d : r[1]] : [d, d];
    }
    const elsewhere = Object.entries(seen).filter(([t]) => !t.startsWith(TAG + " (#" + KID + ")"))
      .sort((a, b) => b[1][1].localeCompare(a[1][1])).map(([t, r]) => ({ tag: t, last: r[1] }));
    const names = [...new Set([...(h.names || []).map((x) => x[1]), ...recNames, ...(note.names || [])])].filter((n) => n !== m.name);
    const sim = similar(m.name, m.id);
    // joinedBetween: only known to have joined somewhere in this date range (from older, gappy data)
    const since = joinedRec ? (joinedRec.first ? tr("before", { d: joinedRec.d }) : joinedRec.d) : h.before ? tr("before", { d: started }) : h.joinedBetween ? tr("between", { a: h.joinedBetween[0], b: h.joinedBetween[1] }) : (h.firstSeen || "");
    const newFor = joinedRec ? (joinedRec.first ? null : daysBetween(joinedRec.d, today)) : !h.before && h.firstSeen ? daysBetween(h.joinedBetween ? h.joinedBetween[0] : h.firstSeen, today) : null;
    // joined after tracking began, no Record data, and nobody has checked yet
    const needCheck = !h.before && !rec.length && !note.checked;
    const pD = change(h.power, 7), kD = change(h.kills, 7);
    const flags = [];
    if (needCheck) flags.push({ t: tr("fNeedCheck"), hi: true });
    if (newFor != null && newFor <= newDays) flags.push({ t: tr("fNew", { n: newFor }), hi: true });
    if (m.kid && m.kid !== KID) flags.push({ t: tr("fKid", { k: m.kid }), hi: true });
    const R = new Set(tagList(rivals)), F = new Set(tagList(farms));
    const rivalSeen = elsewhere.filter((e) => R.has(tagOf(e.tag)));
    if (rivalSeen.length) flags.push({ t: tr("fRival", { t: rivalSeen.map((e) => tagOf(e.tag)).join(", ") }), hi: true });
    elsewhere.filter((e) => !R.has(tagOf(e.tag)) && !F.has(tagOf(e.tag))).slice(0, 2).forEach((e) => flags.push({ t: tr("fFrom", { t: e.tag }) }));
    const hops = new Set(elsewhere.map((e) => tagOf(e.tag)).filter((t) => !F.has(t))).size;
    if (hops >= 3) flags.push({ t: tr("fHops", { n: hops }), hi: true });
    if (names.length) flags.push({ t: tr("fRenamed") });
    const simRival = [...new Set(sim.map((s) => tagOf(s.tag)).filter((t) => R.has(t)))];
    if (simRival.length) flags.push({ t: tr("fRivalName", { t: simRival.join(", ") }), hi: true });
    if (pD != null && m.power && pD < -0.05 * m.power) flags.push({ t: tr("fDrop") });
    return {
      m, h, id: m.id, name: m.name, rank: m.rank, power: m.power, pD, kills: m.kills, kD, tc: m.tc,
      kid: m.kid, lang: m.lang, since, hops, sinceSort: h.before ? "0" : (h.firstSeen || ""),
      from: elsewhere.map((e) => e.last ? `${e.tag} (${e.last})` : e.tag).join("; "),
      names: names.join("; "),
      similar: sim.filter((s) => !F.has(tagOf(s.tag))).map((s) => `${s.nm} — ${s.tag}, ID ${s.id}`).join("; "),
      login: toDate(m.lastLogin) || (typeof m.lastLogin === "string" ? m.lastLogin.replace(/^Last active\s*/i, "") : ""),
      note, needCheck, cs: note.clear || "", clear: note.clear === "yes" ? "Yes" : note.clear === "no" ? "No" : "", why: note.why || "",
      flags,
    };
  });
}

const COLS = [
  ["name", "colName"], ["rank", "colRank"], ["flags", "colFlags"], ["clear", "colClear"], ["why", "colWhy"], ["since", "colSince"], ["from", "colFrom"], ["hops", "colHops", 1],
  ["names", "colNames"], ["similar", "colSimilar"], ["power", "colPower", 1], ["pD", "colPowerD", 1],
  ["kills", "colKills", 1], ["kD", "colKillsD", 1], ["tc", "colTc", 1], ["kid", "colKid", 1], ["lang", "colLang"], ["login", "colLogin"],
];

function sorted() {
  const q = core($("wa_q").value);
  let list = rows.filter((r) => !q || core(r.name).includes(q) || String(r.id).includes($("wa_q").value.trim()));
  if ($("onlyFlag").checked) list = list.filter((r) => r.flags.length || r.cs === "no");
  // "Check Record" first, then "Not clear"; "Cleared" goes to the bottom
  const val = (r) => sortKey === "flags" ? r.flags.filter((f) => f.hi).length * 10 + r.flags.length + (r.needCheck ? 2000 : 0) + (r.cs === "no" ? 1000 : r.cs === "yes" ? -1000 : 0) : sortKey === "since" ? r.sinceSort : r[sortKey];
  return list.sort((a, b) => {
    const x = val(a), y = val(b);
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "number" ? x - y : String(x).localeCompare(String(y))) * sortDir;
  });
}

function render() {
  $("head").innerHTML = COLS.map(([k, t, num]) => `<th class="${num ? "num" : ""}" data-k="${k}">${esc(tr(t))}${sortKey === k ? (sortDir > 0 ? " ▲" : " ▼") : ""}</th>`).join("");
  $("head").querySelectorAll("th").forEach((th) => th.onclick = () => {
    const k = th.dataset.k; if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = ["name", "rank", "lang", "since", "why"].includes(k) ? 1 : -1; } render();
  });
  const list = sorted();
  $("count").textContent = `${list.length} / ${rows.length}`;
  const ch = (v) => v == null ? "" : `<span class="${v > 0 ? "up" : v < 0 ? "down" : ""}">${v > 0 ? "+" : ""}${big(v)}</span>`;
  const clearCell = (r) => (r.cs === "yes" ? `<span class="flag ok">✅ ${esc(tr("fCleared"))}</span>` : r.cs === "no" ? `<span class="flag hi">⚠️ ${esc(tr("fNotClear"))}</span>` : "")
    + (TOKEN ? ` <button class="btn mini" data-edit="${esc(r.id)}">✏️</button>` : "");
  const whyCell = (r) => esc(r.why) + (r.note.by || r.note.at ? `<div class="id">${esc([r.note.by, r.note.at].filter(Boolean).join(" · "))}</div>` : "");
  $("rows").innerHTML = list.length ? list.map((r) => `<tr>
    <td><div class="name" dir="auto">${esc(r.name)}</div><div class="id">ID ${esc(r.id)}${r.m.uid ? ` · <a href="https://mightpulse.com/player/${encodeURIComponent(r.m.uid)}" target="_blank" rel="noopener">Record ↗</a>` : ""}</div></td>
    <td>${esc(r.rank)}</td>
    <td class="wrapc">${r.flags.map((f) => `<span class="flag${f.hi ? " hi" : ""}">${esc(f.t)}</span>`).join("")}</td>
    <td>${clearCell(r)}</td>
    <td class="wrapc" dir="auto">${whyCell(r)}</td>
    <td>${esc(r.since)}</td>
    <td class="wrapc">${esc(r.from)}</td>
    <td class="num">${r.hops || ""}</td>
    <td class="wrapc" dir="auto">${esc(r.names)}</td>
    <td class="wrapc" dir="auto">${esc(r.similar)}</td>
    <td class="num">${big(r.power)}</td><td class="num">${ch(r.pD)}</td>
    <td class="num">${big(r.kills)}</td><td class="num">${ch(r.kD)}</td>
    <td class="num">${esc(r.tc)}</td><td class="num">${esc(r.kid)}</td><td>${esc(r.lang)}</td><td>${esc(r.login)}</td>
  </tr>`).join("") : `<tr><td colspan="${COLS.length}" class="empty">${esc(tr("empty"))}</td></tr>`;

  const left = (watch.left || []).slice().reverse();
  $("left").innerHTML = left.length ? left.map((l) => {
    const seen = (watch.seen || {})[l.id] || {};
    const after = Object.entries(seen).filter(([t, r]) => !t.startsWith(TAG + " (#") && r[1] >= l.leftOn).map(([t]) => t).join(", ");
    return `<tr><td><div class="name" dir="auto">${esc(l.name)}</div><div class="id">ID ${esc(l.id)}</div></td><td>${esc(l.leftOn)}</td><td>${esc(after)}</td></tr>`;
  }).join("") : `<tr><td colspan="3" class="empty">—</td></tr>`;

  $("notes").innerHTML = [tr("n1", { s: watch.started }), tr("n2"), tr("n3", { d: 7 }), tr("n4"), ...(records ? [tr("n5", { d: String(records.pulledAt).slice(0, 10) })] : []), ...(TOKEN ? [tr("n6")] : [])].map((x) => `<li>${esc(x)}</li>`).join("");
}
$("rows").onclick = (e) => {
  const b = e.target.closest("[data-edit]"); if (!b) return;
  const r = rows.find((x) => String(x.id) === b.dataset.edit); if (r) editNote(r);
};

function applyTexts() {
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
  ROOT.querySelectorAll("[data-t]").forEach((el) => { el.textContent = tr(el.dataset.t); });
  $("wa_q").placeholder = tr("search");
  if (watch) $("wa_meta").textContent = tr("updated", { t: new Date(watch.updated || roster.updated).toLocaleString(lang === "zh" ? "zh-TW" : "en-GB"), s: watch.started });
}

function table() {
  const head = ["Name", "Governor ID", "Rank", "Flags", "In NXS since", "Seen in other alliances", "Alliances seen", "Earlier names", "Similar names elsewhere",
    "Power", "Power change (7d)", "Kills", "Kills change (7d)", "TC", "Kingdom", "Language", "Last login", "MightPulse record", "Clear", "Why / comments"];
  const body = sorted().map((r) => [r.name, r.id, r.rank, r.flags.map((f) => f.t).join("; "), r.since, r.from, r.hops || "", r.names, r.similar,
    r.power ?? "", r.pD ?? "", r.kills ?? "", r.kD ?? "", r.tc ?? "", r.kid ?? "", r.lang ?? "", r.login, r.m.uid ? `https://mightpulse.com/player/${r.m.uid}` : "", r.clear, r.why]);
  return [head, ...body];
}
$("wa_copyBtn").onclick = async () => {
  const text = table().map((row) => row.map((c) => String(c).replace(/[\t\n\r]+/g, " ")).join("\t")).join("\n");
  try { await navigator.clipboard.writeText(text); } catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; ROOT.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
  }
  const b = $("wa_copyBtn"); b.textContent = tr("copied"); setTimeout(() => (b.textContent = tr("copy")), 2500);
};
$("csvBtn").onclick = () => {
  const csv = table().map((row) => row.map((c) => { const s = String(c); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(",")).join("\r\n");
  const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `nxs-watch-${new Date().toISOString().slice(0, 10)}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
function setLang(l) { lang = l; store.lang = lang; save(); applyTexts(); if (watch) { build(); render(); } };
$("wa_q").oninput = () => render();
$("onlyFlag").onchange = () => render();
$("newDays").value = newDays;
$("rivals").value = rivals; $("farms").value = farms;
$("rivals").onchange = () => { rivals = $("rivals").value; store.rivals = rivals; save(); build(); render(); };
$("farms").onchange = () => { farms = $("farms").value; store.farms = farms; save(); build(); render(); };
$("newDays").onchange = () => { newDays = Math.max(1, Number($("newDays").value) || 14); store.newDays = newDays; save(); build(); render(); };

async function init() {
  TOKEN = OFFICER.token;
  applyTexts();
  try {
    // copies remembered in this tab show at once; newer ones replace them when they arrive
    const refresh = (set) => (d) => { set(d); if (roster && watch) { build(); render(); } };
    // notes: the remembered copy is used at once, the newest arrives behind it
    const cachedNotes = OfficerData.cacheGet("notes");
    if (cachedNotes) notes = cachedNotes;
    const notesDone = loadNotes().then(() => { OfficerData.cacheSet("notes", notes); if (cachedNotes && roster && watch && JSON.stringify(notes) !== JSON.stringify(cachedNotes)) { build(); render(); } });
    const [a, b, rec] = await Promise.all([
      OfficerData.fetchJsonFast("data/roster-x7k2p9.json", refresh((d) => { roster = d; })),
      OfficerData.fetchJsonFast("data/watch-x7k2p9.json", refresh((d) => { watch = d; })),
      OfficerData.fetchJsonFast("data/records-x7k2p9.json", refresh((d) => { records = d; })).catch(() => undefined),
      cachedNotes ? null : notesDone,
    ]);
    roster = a || null;
    if (rec !== undefined) records = rec;
    watch = b || null;
  } catch (e) {}
  if (!roster || !watch) { $("wa_noData").hidden = false; $("wa_noData").textContent = tr("noData"); return; }
  $("wa_app").hidden = false;
  applyTexts(); build(); render();
}

OFFICER_PAGES.watch = { init, applyTexts, setLang };


})();
officerGate();
</script>
<script src="js/assistant.js"></script>
