name: Dump raw MightPulse data (artifact)
on:
  workflow_dispatch:
    inputs:
      include:
        description: "include= list to request per player"
        default: "base,ranks,heroes,troops,buildings,research,stats,history"
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/dump-mightpulse.js
        env:
          MIGHTPULSE_API_KEY: ${{ secrets.MIGHTPULSE_API_KEY }}
          INCLUDE: ${{ github.event.inputs.include }}
      - uses: actions/upload-artifact@v4
        with:
          name: raw-mightpulse
          path: raw-mightpulse.json
          retention-days: 2
