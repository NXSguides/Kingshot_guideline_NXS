name: Split Content
# data/content.js (all languages, the file you edit) → data/content-core.js + data/content-<lang>.js
# (what the website loads, so visitors only download their own language)
on:
  push:
    paths: ["data/content.js", "scripts/split-content.js"]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: split-content
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/split-content.js
      - run: |
          git config user.name "split-content-bot"
          git config user.email "actions@github.com"
          git add data/content-core.js data/content-*.js
          git diff --cached --quiet && exit 0
          git commit -m "更新網站載入用的語言檔"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null
            sleep 5
          done
          exit 1
