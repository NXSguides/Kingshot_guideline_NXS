name: Fetch member records (one-time)
on:
  workflow_dispatch:
concurrency:
  group: update-roster
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-records.js
        env:
          MIGHTPULSE_API_KEY: ${{ secrets.MIGHTPULSE_API_KEY }}
      - run: |
          git config user.name "roster-bot"
          git config user.email "actions@github.com"
          git add data/records-x7k2p9.json
          git diff --cached --quiet && exit 0
          git commit -m "Save member records (one-time)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null
            sleep 5
          done
          exit 1
