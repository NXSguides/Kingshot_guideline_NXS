name: Build Officer AI Context
on:
  push:
    paths: ["scripts/build-officer-context.js"]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: update-roster
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-officer-context.js
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
      - run: |
          git config user.name "roster-bot"
          git config user.email "actions@github.com"
          git add data/ai-officer.json
          git diff --cached --quiet && exit 0
          git commit -m "Update officer AI context"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null
            sleep 5
          done
          exit 1
