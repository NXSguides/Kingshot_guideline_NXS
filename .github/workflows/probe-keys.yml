name: Check MightPulse API shape (one-off)
# prints only the structure of each reply (no values) — see scripts/probe-keys.js
on:
  workflow_dispatch:
    inputs:
      paths: { description: 'API paths, space-separated', required: true }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe-keys.js
        env:
          MIGHTPULSE_API_KEY: ${{ secrets.MIGHTPULSE_API_KEY }}
          PATHS: ${{ inputs.paths }}
