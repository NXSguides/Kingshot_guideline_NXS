name: Check MightPulse hero fields (one-off)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe-heroes.js
        env:
          MIGHTPULSE_API_KEY: ${{ secrets.MIGHTPULSE_API_KEY }}
      - run: |
          git config user.name "probe-bot"
          git config user.email "actions@github.com"
          git add data/probe-heroes.txt
          git commit -m "Probe hero fields [skip ci]" && git pull --rebase origin main && git push origin HEAD:main
