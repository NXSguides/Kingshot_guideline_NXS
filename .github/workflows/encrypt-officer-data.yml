name: Encrypt Officer Data
on:
  workflow_dispatch:

concurrency:
  group: update-roster   # never run at the same time as the roster update
  cancel-in-progress: false

jobs:
  encrypt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/encrypt-officer-data.js
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
      - run: |
          git config user.name "roster-bot"
          git config user.email "actions@github.com"
          git add data/*-x7k2p9.json
          git diff --cached --quiet && exit 0
          git commit -m "Encrypt officer data"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null
            sleep 5
          done
          exit 1
