<style>
  body { padding: 16px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-family: "Oswald", "Noto Sans TC", sans-serif; margin: 0 0 4px; font-size: 26px; }
  .muted { color: var(--text-muted); font-size: 13px; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .btn { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--panel); color: var(--text); cursor: pointer; font-size: 14px; }
  a.btn { text-decoration: none; display: inline-block; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .btn.small { padding: 4px 9px; font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 14px; margin: 14px 0; box-shadow: 0 4px 14px var(--shadow); }
  .card h2 { margin: 0 0 10px; font-size: 18px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tabs { display: flex; gap: 6px; margin: 14px 0 0; border-bottom: 2px solid var(--rule); flex-wrap: wrap; }
  .tabs a { padding: 9px 14px; border-radius: 10px 10px 0 0; text-decoration: none; color: var(--text-muted); font-weight: 600; border: 1px solid transparent; border-bottom: 0; }
  .tabs a.on { color: var(--text); background: var(--panel); border-color: var(--rule); margin-bottom: -2px; border-bottom: 2px solid var(--panel); }
  @media (max-width: 440px) { .tabs { gap: 0; flex-wrap: nowrap; overflow-x: auto; } .tabs a { padding: 8px 6px; font-size: 13px; white-space: nowrap; } }
  .weeknav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .weeknav .lbl { font-weight: 700; text-align: center; flex: 1; }
  .day { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--rule); }
  .day:last-child { border-bottom: 0; }
  .day.today { background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 8px; padding-inline: 6px; }
  .dname { font-weight: 700; line-height: 1.2; }
  .dname small { display: block; font-weight: 400; color: var(--text-muted); font-size: 12px; }
  .ev { display: inline-flex; align-items: center; gap: 4px; margin: 2px 6px 2px 0; padding: 3px 9px; border-radius: 999px; font-size: 13px; border: 1px solid var(--rule); background: var(--panel-2); }
  .ev.start { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 20%, var(--panel)); font-weight: 700; }
  .ev .n { font-size: 11px; color: var(--text-muted); }
  .none { color: var(--text-muted); font-size: 13px; }
  .todo { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 10px; background: var(--panel-2); margin: 8px 0; }
  .todo input { width: 20px; height: 20px; margin-top: 2px; flex: none; }
  .todo.done .txt { opacity: .55; text-decoration: line-through; }
  .todo .when { font-size: 12px; color: var(--text-muted); }
  .todo .acts { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .msg { margin-top: 6px; font-size: 13px; }
  .warn { color: var(--accent); }
  [hidden] { display: none !important; }
  .ev { cursor: pointer; }
  .evrow { border-bottom: 1px solid var(--rule); padding: 8px 0; }
  .evrow:last-child { border-bottom: 0; }
  .evrow > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .evrow > summary::-webkit-details-marker { display: none; }
  .sched { font-size: 12px; color: var(--text-muted); font-weight: 400; }
  .evrow.flash { animation: flash 1.6s; }
  @keyframes flash { 0%, 40% { background: color-mix(in srgb, var(--accent) 25%, transparent); } 100% { background: transparent; } }
  .ig { background: var(--panel-2); border-radius: 10px; padding: 10px; margin: 8px 0; }
  .ig .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 6px; }
  .ig .head .btn { white-space: nowrap; flex: none; }
  .ig pre { white-space: pre-wrap; word-break: break-word; margin: 0; font-family: inherit; font-size: 14px; line-height: 1.45; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; overflow-y: auto; padding: 16px; }
  .modal .card { max-width: 640px; margin: 10px auto 40px; }
  label.f { display: block; font-weight: 600; margin: 12px 0 4px; font-size: 14px; }
  label.f small { font-weight: 400; color: var(--text-muted); }
  .inp, .modal select, .modal textarea { width: 100%; box-sizing: border-box; padding: 8px 10px; font-size: 15px; border-radius: 8px; border: 1px solid var(--rule); background: var(--panel-2); color: var(--text); font-family: inherit; }
  .modal textarea { min-height: 160px; line-height: 1.45; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; align-items: end; }
  .grid2 { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px; }
  .grid3 > div, .grid2 > div { min-width: 0; }
  .inp { display: block; min-width: 0; max-width: 100%; }
  input[type=date].inp { -webkit-appearance: none; appearance: none; min-height: 40px; text-align: left; }
  @media (max-width: 520px) { .grid3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .grid3 > div:first-child { grid-column: 1 / -1; } }

  .todo-ed .due .inp { width: 80px; }
  .sub { border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px; margin: 8px 0; }
  .sub .row { justify-content: space-between; }
  .okmsg { color: #2e7d32; }
</style>
</head>

      </div>
      <div class="muted msg" data-t="mgrNote"></div>
      <div id="evList"></div>
      <div class="msg" id="saveMsg"></div>
    </div>
  </div>

  <div class="modal" id="editor" hidden>

      <div class="grid2">

        <div><label class="f" data-t="fDays"></label><input class="inp" type="number" min="1" id="edDays"></div>
      </div>
      <label class="f"><span data-t="fNote"></span> <small data-t="fNoteSm"></small></label><input class="inp" id="edNote" maxlength="120">
      <label class="f" data-t="fGuide"></label><select id="edGuide"></select>
      <label class="f" data-t="fTodo"></label>

      <button class="btn small" id="edAddTodo" data-t="addTodo"></button>

      <div id="edIgs"></div>

    </div>
  </div>
</div>

// every run of each scheduled event that touches [from, to)
function runs(from, to) {
  const out = [];
  for (const e of LIST) {
    if (!e.start || !(e.every > 0) || !(e.days > 0)) continue;
    const anchor = dayMs(e.start);
    let n = Math.max(0, Math.floor((from - anchor) / DAY / e.every) - 1);
    for (;; n++) {
      const st = anchor + n * e.every * DAY;
      if (st >= to) break;
      const en = st + e.days * DAY;
      if (en > from) out.push({ k: e.id, st, en, days: e.days });
    }
  }
  return out.sort((a, b) => a.st - b.st);
}

document.addEventListener("click", (ev) => {
  const o = ev.target.closest("[data-open]"); if (o) { ev.preventDefault(); return openEvent(o.dataset.open); }
  const c = ev.target.closest("[data-copy]"); if (c) { ev.preventDefault(); const [id, i] = c.dataset.copy.split(":"); return copyText(byId(id).ingame[+i].text, c); }
  const ed = ev.target.closest("[data-edit]"); if (ed) { ev.preventDefault(); return openEditor(ed.dataset.edit); }
  const ie = ev.target.closest("[data-igedit]"); if (ie) { ev.preventDefault(); return igInline(ie); }
});

/* edit one in-game message right in the list */
function igInline(btn) {
  const [id, i] = btn.dataset.igedit.split(":"); const box = btn.closest(".ig"); const g = byId(id).ingame[+i];
  box.innerHTML = `<input class="inp" data-k="title" value="${esc(g.title || "")}" placeholder="${esc(tr("igTitle"))}">
    <textarea class="inp" data-k="text" style="margin-top:6px;min-height:200px;line-height:1.45">${esc(g.text)}</textarea>
    <div class="row" style="justify-content:flex-end;margin-top:6px"><span class="sched" data-k="n"></span><button type="button" class="btn small" data-k="cancel">${esc(tr("cancel"))}</button><button type="button" class="btn small primary" data-k="save">${esc(tr("save"))}</button></div>`;
  const ta = box.querySelector('[data-k="text"]'), n = box.querySelector('[data-k="n"]');
  const count = () => { n.textContent = `${[...ta.value].length} ${tr("chars")}`; }; count(); ta.oninput = count; ta.focus();
  box.querySelector('[data-k="cancel"]').onclick = () => renderList();
  box.querySelector('[data-k="save"]').onclick = async () => {
    const e = { ...byId(id), ingame: byId(id).ingame.map((x, j) => (j === +i ? { title: box.querySelector('[data-k="title"]').value.trim(), text: ta.value.replace(/\r/g, "").trimEnd() } : x)) };
    if (await saveList(LIST.map((x) => (x.id === id ? e : x)), `Edit in-game guide: ${e.en || e.zh}`)) { renderList(); openEvent(id); }
  };
}

/* ===== editor ===== */
let editing = null;   // id of the event being edited, or null for a new one
function todoRow(td = {}) {
  return `<div class="sub todo-ed">
    <div class="row"><label class="due">${esc(tr("dueLbl"))} <input class="inp" type="number" data-k="due" value="${esc(td.due ?? 0)}"></label><button type="button" class="btn small" data-rm>${esc(tr("remove"))}</button></div>
    <input class="inp" data-k="txt" placeholder="${esc(tr("tdTxt"))}" value="${esc(td[lang] || td[lang === "zh" ? "en" : "zh"] || "")}" data-other="${esc(td[lang === "zh" ? "en" : "zh"] || "")}" data-had="${td[lang] ? 1 : 0}" style="margin-top:6px">
    <div class="row" style="justify-content:flex-start;font-size:13px;margin-top:6px"><label><input type="checkbox" data-k="post"${td.post ? " checked" : ""}> ${esc(tr("tdPost"))}</label><label><input type="checkbox" data-k="ranking"${td.ranking ? " checked" : ""}> ${esc(tr("tdRank"))}</label></div>
  </div>`;
}
function igRow(g = {}) {
  return `<div class="sub ig-ed">
    <div class="row"><input class="inp" data-k="title" placeholder="${esc(tr("igTitle"))}" value="${esc(g.title || "")}" style="flex:1"><button type="button" class="btn small" data-rm>${esc(tr("remove"))}</button></div>
    <textarea data-k="text" placeholder="${esc(tr("igText"))}" style="margin-top:6px">${esc(g.text || "")}</textarea>
  </div>`;
}
function openEditor(id) {
  editing = id;
  const e = id ? byId(id) : { emoji: "📅", en: "", zh: "", start: isoDay(utcDay(Date.now())), every: 7, days: 1, guide: "", note: "", todo: [], ingame: [] };
  $("edTitle").textContent = tr(id ? "editEv" : "newEv");
  $("edEmoji").value = e.emoji || ""; $("edName").value = e[lang] || e[lang === "zh" ? "en" : "zh"] || "";
  const fixed = !!(e.start && e.every > 0);
  $("edFixed").checked = fixed; $("edSched").hidden = !fixed;
  $("edStart").value = e.start || isoDay(utcDay(Date.now())); $("edEvery").value = e.every || 7; $("edDays").value = e.days || 1;
  $("edNote").value = noteOf(e);
  $("edGuide").innerHTML = `<option value="">${esc(tr("noGuide"))}</option>` + Object.entries(GUIDE_LIST).map(([k, g]) => `<option value="${k}">${g.e} ${esc(g[lang] || g.en)}</option>`).join("");
  $("edGuide").value = e.guide || "";
  $("edTodos").innerHTML = (e.todo || []).map(todoRow).join("");
  $("edIgs").innerHTML = (e.ingame || []).map(igRow).join("");
  $("edDel").hidden = !id; $("edMsg").textContent = "";
  $("editor").hidden = false; $("editor").scrollTop = 0;
}
$("edFixed").onchange = () => { $("edSched").hidden = !$("edFixed").checked; };
$("edAddTodo").onclick = () => $("edTodos").insertAdjacentHTML("beforeend", todoRow({ due: -1 }));
$("edAddIg").onclick = () => $("edIgs").insertAdjacentHTML("beforeend", igRow());
$("editor").addEventListener("click", (ev) => { const r = ev.target.closest("[data-rm]"); if (r) r.closest(".sub").remove(); });
$("edCancel").onclick = () => { $("editor").hidden = true; };
function readEditor() {
  const e = editing ? { ...byId(editing) } : {};
  // only the page language is edited; the other language's text is kept as it was
  const other = lang === "zh" ? "en" : "zh";
  e.emoji = $("edEmoji").value.trim(); e[lang] = $("edName").value.trim();
  if (!e[lang]) throw new Error(tr("needName"));
  if (!e[other]) e[other] = e[lang];
  if ($("edFixed").checked) {
    e.start = $("edStart").value; e.every = Math.round(+$("edEvery").value); e.days = Math.round(+$("edDays").value);
    if (!/^\d{4}-\d\d-\d\d$/.test(e.start) || !(e.every > 0) || !(e.days > 0)) throw new Error(tr("needSched"));
  } else { e.start = ""; e.every = 0; e.days = 0; }
  const nv = $("edNote").value.trim();
  if (lang === "zh") e.noteZh = nv; else e.note = nv;
  e.guide = $("edGuide").value;
  e.todo = [...document.querySelectorAll("#edTodos .todo-ed")].map((r) => {
    const g = (k) => r.querySelector(`[data-k="${k}"]`);
    const t = g("txt"), v = t.value.trim();
    const o = { due: Math.round(+g("due").value || 0), [lang]: v, [other]: t.dataset.other || v };
    if (g("post").checked) o.post = 1; if (g("ranking").checked) o.ranking = 1;
    return o;
  }).filter((o) => o.zh || o.en);
  e.ingame = [...document.querySelectorAll("#edIgs .ig-ed")].map((r) => ({ title: r.querySelector('[data-k="title"]').value.trim(), text: r.querySelector('[data-k="text"]').value.replace(/\r/g, "").trimEnd() })).filter((g) => g.text);
  if (!e.id) { const base = (e.en || "event").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "event"; let id = base, n = 2; while (byId(id)) id = base + "-" + n++; e.id = id; }
  return e;
}
$("edSave").onclick = async () => {
  let e; try { e = readEditor(); } catch (err) { $("edMsg").textContent = err.message; return; }
  const next = editing ? LIST.map((x) => (x.id === editing ? e : x)) : [...LIST, e];
  if (await saveList(next, `${editing ? "Edit" : "Add"} event: ${e.en || e.zh}`)) { $("editor").hidden = true; render(); openEvent(e.id); }
};
$("edDel").onclick = async () => {
  if (!editing || !confirm(tr("confirmDel"))) return;
  const name = evName(editing);
  if (await saveList(LIST.filter((x) => x.id !== editing), `Delete event: ${name}`)) { $("editor").hidden = true; render(); }
};

/* ===== GitHub (same key and password as the Post tab) ===== */
const b64ToUtf8 = (b64) => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, "")), (c) => c.charCodeAt(0)));
const utf8ToB64 = (str) => { const u = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(s); };
async function gh(method, path, body) {
  let res;
  try {
    res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}${method === "GET" ? "?ref=" + BRANCH + "&t=" + Date.now() : ""}`, {
      method, headers: { Authorization: `Bearer ${TOKEN}`, Accept: "application/vnd.github+json" }, body: body ? JSON.stringify(body) : undefined, cache: "no-store" });
  } catch (e) { throw new Error("net"); }
  if (res.status === 401 || res.status === 403) throw new Error("auth");
  if (res.status === 409 || res.status === 422) throw new Error("busy");
  if (method === "GET" && res.status === 404) return null;
  if (!res.ok) throw new Error("net");
  return res.json();
}
async function loadToken() {
  try {
    const blob = await (await fetch("data/post-key.json?t=" + Date.now(), { cache: "no-store" })).json();
    const dec = (b) => Uint8Array.from(atob(b.replace(/\s/g, "")), (c) => c.charCodeAt(0));
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(OFFICER_PW), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: dec(blob.salt), iterations: blob.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    TOKEN = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: dec(blob.iv) }, key, dec(blob.data)));
  } catch (e) { TOKEN = null; }
}
async function saveList(next, message) {
  const m = $("saveMsg"), em = $("edMsg");
  if (!TOKEN) { em.textContent = tr("noKey"); return false; }
  em.textContent = ""; m.className = "msg"; m.textContent = tr("saving");
  const sched = {};
  for (const e of next) if (e.start && e.every > 0 && e.days > 0) sched[e.id] = { anchor: e.start, periodDays: e.every, activeDays: e.days };
  const file = { v: 1, updated: new Date().toISOString(), sched, data: await OfficerData.seal({ events: next }) };
  try {
    const r = await gh("PUT", EV_PATH, { message: message.slice(0, 120), content: utf8ToB64(JSON.stringify(file, null, 1) + "\n"), sha: FILE_SHA || undefined, branch: BRANCH });
    FILE_SHA = r && r.content ? r.content.sha : FILE_SHA;
    LIST = next; m.className = "msg okmsg"; m.textContent = tr("saved"); return true;
  } catch (err) {
    const k = err.message === "auth" ? "errAuth" : err.message === "busy" ? "errBusy" : "errNet";
    m.className = "msg warn"; m.textContent = tr(k); em.textContent = tr(k); return false;
  }
}

function applyTexts() {
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = tr(el.dataset.t); });
  $("langBtn").textContent = lang === "zh" ? "English" : "中文";
}
$("langBtn").onclick = () => { lang = lang === "zh" ? "en" : "zh"; store.lang = lang; save(); setOfficerLang(lang); applyTexts(); if (LIST) render(); };
$("prevW").onclick = () => { weekStart -= 7 * DAY; render(); };
$("nextW").onclick = () => { weekStart += 7 * DAY; render(); };
$("thisW").onclick = () => { weekStart = defaultWeek(); render(); };
$("addEv").onclick = () => openEditor(null);
// On Sunday, open on next week (that's when the weekly planning happens)
function defaultWeek() { const now = Date.now(); const m = mondayOf(now); return new Date(utcDay(now)).getUTCDay() === 0 ? m + 7 * DAY : m; }

async function init() {
  applyTexts();
  if (OFFICER_PW) await loadToken();
  // 1) the saved list (fresh copy from GitHub when the key works, otherwise the site's copy)
  let file = null;
  try {
    if (TOKEN) { const f = await gh("GET", EV_PATH); if (f) { FILE_SHA = f.sha; file = JSON.parse(b64ToUtf8(f.content)); } }
    else { const r = await fetch(EV_PATH + "?t=" + Date.now(), { cache: "no-store" }); if (r.ok) file = await r.json(); }
    if (file && file.data) { const d = await OfficerData.open(file.data); LIST = d && d.events; }
  } catch (e) { LIST = null; }
  // 2) nothing saved yet: start from the schedules already on the site
  if (!LIST) {
    let sched = null;
    try {
      const src = await fetch("js/app.js?t=" + Date.now(), { cache: "no-store" }).then((r) => r.text());
      const m = src.match(/const EVENT_SCHEDULES = (\{[\s\S]*?\n\});/);
      sched = m ? Function('"use strict";return (' + m[1] + ");")() : null;
    } catch (e) { sched = null; }
    if (!sched) { $("noData").hidden = false; $("noData").textContent = tr("noData"); return; }
    LIST = defaultList(sched);
  }
  $("app").hidden = false;
  weekStart = defaultWeek(); render();
}

/* ===== officer password (shared with the other tabs: same password, same saved login) ===== */
const OFFICER_LS = "nxs-post-v1";
const b64dec_ = (b64) => Uint8Array.from(atob(b64.replace(/\s/g, "")), (c) => c.charCodeAt(0));
async function officerCheck(pw, blob) {
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64dec_(blob.salt), iterations: blob.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64dec_(blob.iv) }, key, b64dec_(blob.data));
    return true;
  } catch (e) { return false; }
}
function officerStore() { try { return JSON.parse(localStorage.getItem(OFFICER_LS)) || {}; } catch (e) { return {}; } }
async function officerGate(onOk) {
  let blob = null;
  try { const r = await fetch("data/post-key.json?t=" + Date.now(), { cache: "no-store" }); blob = r.ok ? await r.json() : null; } catch (e) {}
  if (!blob) return onOk();
  const st = officerStore();
  if (st.pw && (await officerCheck(st.pw, blob))) { OFFICER_PW = st.pw; await OfficerData.unlock(st.pw); return onOk(); }
  $("gate").hidden = false;
  const go = async () => {
    const pw = $("gatePw").value;
    if (await officerCheck(pw, blob)) {
      OFFICER_PW = pw; await OfficerData.unlock(pw);
      if ($("gateRemember").checked) { const s = officerStore(); s.pw = pw; try { localStorage.setItem(OFFICER_LS, JSON.stringify(s)); } catch (e) {} }
      $("gate").hidden = true; onOk();
    } else { $("gateErr").hidden = false; $("gatePw").value = ""; $("gatePw").focus(); }
  };
  $("gateBtn").onclick = go;
  $("gatePw").onkeydown = (e) => { if (e.key === "Enter") go(); };
  $("gatePw").focus();
}
try { const th = localStorage.getItem("ks-theme"); if (th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th); } catch (e) {}
officerGate(init);

// coming back to this tab with the browser's Back button: follow a language change made on another tab
window.addEventListener("pageshow", (e) => { if (e.persisted && officerLang() && officerLang() !== lang) location.reload(); });
</script>
