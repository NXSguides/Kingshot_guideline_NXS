<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>NXS Events</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="css/styles.css">
<style>
  body { padding: 16px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-family: "Oswald", "Noto Sans TC", sans-serif; margin: 0 0 4px; font-size: 26px; }
  .muted { color: var(--text-muted); font-size: 13px; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .btn { padding: 7px 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--panel); color: var(--text); cursor: pointer; font-size: 14px; }
  a.btn { text-decoration: none; display: inline-block; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .btn.small { padding: 4px 9px; font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 14px; margin: 14px 0; box-shadow: 0 4px 14px var(--shadow); }
  .card h2 { margin: 0 0 10px; font-size: 18px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tabs { display: flex; gap: 6px; margin: 14px 0 0; border-bottom: 2px solid var(--rule); flex-wrap: wrap; }
  .tabs a { padding: 9px 14px; border-radius: 10px 10px 0 0; text-decoration: none; color: var(--text-muted); font-weight: 600; border: 1px solid transparent; border-bottom: 0; }
  .tabs a.on { color: var(--text); background: var(--panel); border-color: var(--rule); margin-bottom: -2px; border-bottom: 2px solid var(--panel); }
  @media (max-width: 440px) { .tabs { gap: 0; flex-wrap: nowrap; overflow-x: auto; } .tabs a { padding: 8px 6px; font-size: 13px; white-space: nowrap; } }
  .weeknav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .weeknav .lbl { font-weight: 700; text-align: center; flex: 1; }
  .day { display: grid; grid-template-columns: 64px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--rule); }
  .day:last-child { border-bottom: 0; }
  .day.today { background: color-mix(in srgb, var(--accent) 10%, transparent); border-radius: 8px; padding-inline: 6px; }
  .dname { font-weight: 700; line-height: 1.2; }
  .dname small { display: block; font-weight: 400; color: var(--text-muted); font-size: 12px; }
  .ev { display: inline-flex; align-items: center; gap: 4px; margin: 2px 6px 2px 0; padding: 3px 9px; border-radius: 999px; font-size: 13px; border: 1px solid var(--rule); background: var(--panel-2); }
  .ev.start { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 20%, var(--panel)); font-weight: 700; }
  .ev .n { font-size: 11px; color: var(--text-muted); }
  .none { color: var(--text-muted); font-size: 13px; }
  .todo { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 10px; background: var(--panel-2); margin: 8px 0; }
  .todo input { width: 20px; height: 20px; margin-top: 2px; flex: none; }
  .todo.done .txt { opacity: .55; text-decoration: line-through; }
  .todo .when { font-size: 12px; color: var(--text-muted); }
  .todo .acts { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .msg { margin-top: 6px; font-size: 13px; }
  .warn { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap" id="main">
  <div class="top">
    <div>
      <h1 data-t="title"></h1>
      <div class="muted" data-t="sub"></div>
    </div>
    <div class="row">
      <a class="btn" href="./">← <span data-t="home"></span></a>
      <button class="btn" id="langBtn"></button>
    </div>
  </div>

  <nav class="tabs">
    <a href="roster-x7k2p9.html" data-tab="ranking">📊 Ranking</a>
    <a href="post-k4m8q2.html" data-tab="post">📢 Post</a>
    <a href="watch-x7k2p9.html" data-tab="watch">🕵️ Watch</a>
    <a href="events-x7k2p9.html" class="on" data-tab="events">📅 Events</a>
  </nav>

  <div id="gate" class="card" hidden style="max-width:360px;margin:24px auto">
    <h2>🔒 Officer password</h2>
    <input type="password" id="gatePw" autocomplete="current-password" style="width:100%;box-sizing:border-box;padding:10px;font-size:16px;border-radius:8px;border:1px solid var(--rule);background:var(--panel-2);color:var(--text)">
    <label class="row" style="margin-top:8px;font-size:14px"><input type="checkbox" id="gateRemember" checked> Remember on this device / 在這台裝置記住</label>
    <div style="margin-top:10px"><button class="btn primary" id="gateBtn" style="width:100%;padding:12px">Unlock / 解鎖</button></div>
    <div class="msg warn" id="gateErr" hidden>Wrong password / 密碼錯誤</div>
  </div>
  <div id="noData" class="card" hidden></div>

  <div id="app" hidden>
    <div class="card">
      <div class="weeknav">
        <button class="btn" id="prevW">◀</button>
        <div class="lbl" id="weekLbl"></div>
        <button class="btn" id="nextW">▶</button>
      </div>
      <div class="row" style="justify-content:center;margin-top:6px"><button class="btn small" id="thisW" data-t="thisWeek"></button></div>
    </div>

    <div class="card">
      <h2 data-t="todoTitle"></h2>
      <div id="todos"></div>
      <div class="muted msg" data-t="todoNote"></div>
    </div>

    <div class="card">
      <h2 data-t="weekTitle"></h2>
      <div id="days"></div>
      <div class="muted msg" data-t="note"></div>
    </div>
  </div>
</div>
<script>
/* Event list for the week, worked out from the event schedules already on the site (EVENT_SCHEDULES in js/app.js).
   Weeks run Monday–Sunday in UTC (game reset = 00:00 UTC = 08:00 Taiwan). On Sunday the page opens on next week. */
const T = {
  en: {
    title: "NXS Events", sub: "Events this week, and what officers need to schedule.", home: "Home",
    thisWeek: "Back to this week", todoTitle: "✅ Action items", weekTitle: "📅 Events", late: "overdue",
    todoNote: "Ticks are saved on this device only.",
    note: "Dates come from the event schedule on the site. Game days start at 00:00 UTC (08:00 Taiwan). If the in-game calendar differs, the game is right.",
    noTodo: "Nothing to schedule this week 🎉", none: "—", day: "Day {n}/{t}", starts: "starts", ends: "last day",
    noData: "Could not read the event schedule from the site.",
    toPost: "📢 Write announcement", toRanking: "📊 Open Ranking", toGuide: "📖 Guide",
    week: "{a} – {b}", wd: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"],
    runs: "{a} – {b} ({n} days)",
  },
  zh: {
    title: "NXS 活動排程", sub: "這週有哪些活動，以及幹部要安排的事。", home: "回主頁",
    thisWeek: "回到這週", todoTitle: "✅ 待辦事項", weekTitle: "📅 活動", late: "已過期",
    todoNote: "勾選只存在這台裝置上。",
    note: "日期依網站上的活動排程推算。遊戲每天 UTC 00:00（台灣時間早上 8 點）換日。如果跟遊戲內行事曆不同，以遊戲為準。",
    noTodo: "這週沒有需要排時間的活動 🎉", none: "—", day: "第 {n}/{t} 天", starts: "開始", ends: "最後一天",
    noData: "讀不到網站上的活動排程。",
    toPost: "📢 寫公告", toRanking: "📊 打開 Ranking", toGuide: "📖 攻略",
    week: "{a} – {b}", wd: ["一", "二", "三", "四", "五", "六", "日"],
    runs: "{a} – {b}（{n} 天）",
  },
};
// Names follow the in-game wording (same as the site's glossary).
const EVENTS = {
  "kvk":                { emoji: "👑", en: "KvK", zh: "KvK" },
  "viking-vengeance":   { emoji: "🪓", en: "Viking Vengeance", zh: "維京人的掠奪" },
  "swordland-showdown": { emoji: "⚔️", en: "Swordland Showdown", zh: "聖劍爭奪" },
  "tri-alliance-clash": { emoji: "🛡️", en: "Tri-Alliance Clash", zh: "三盟爭霸" },
  "eternity-reach":     { emoji: "⛏️", en: "Eternity's Reach", zh: "失落的遺跡" },
  "all-out":            { emoji: "🔥", en: "All Out", zh: "全軍出擊" },
  "fishing-tournament": { emoji: "🎣", en: "Fishing Tournament", zh: "釣魚大賽" },
  "hero-roulette":      { emoji: "🎰", en: "Hero Roulette", zh: "英雄轉盤" },
  "cesares-fury":       { emoji: "🗡️", en: "Cesares Fury", zh: "征討切薩雷", noGuide: true },
};
// What officers need to do. due: days relative to the event's first day (−1 = the day before).
const TODO = {
  "viking-vengeance": [
    { due: -1, post: 1, en: "Pick the start time and announce it (UTC + local time). Remind everyone to be online and reinforce each other.",
                        zh: "決定開打時間並公告（寫 UTC 和台灣時間），提醒大家準時上線、互相增援。" },
  ],
  "swordland-showdown": [
    { due: -2, post: 1, en: "Open sign-ups and collect the list.", zh: "開放報名、收集名單。" },
    { due: -1, ranking: 1, post: 1, en: "Pick Attackers / Defenders / Joiners in Ranking, make the battle table and post it.",
                                    zh: "在 Ranking 排好 Attacker／Defender／Joiner，做好分工表並發公告。" },
  ],
  "tri-alliance-clash": [
    { due: -2, post: 1, en: "Confirm registration and the line-up.", zh: "確認報名和出戰名單。" },
    { due: -1, ranking: 1, post: 1, en: "Set the meeting time and post the plan.", zh: "決定集合時間並發公告。" },
  ],
  "cesares-fury": [
    { due: 0, en: "Remind everyone: each member gets 5 rally requests — use them, unused ones are lost when the event ends.",
              zh: "提醒大家：每人有 5 份征討召集令可以找盟友集結，活動結束沒用完就會被清除。" },
    { due: 1, post: 1, en: "R4+: once enough members have beaten high-level targets, apply to challenge the Captain and post a time for everyone to join.",
                       zh: "R4 以上：成員擊敗足夠的高等級目標後，申請挑戰頭目，並公告大家一起打的時間。" },
  ],
  "kvk": [
    { due: -1, en: "Remind members: book Chief Minister slots, save Intel Missions, count saved items (the site's KvK checklist pops up).",
               zh: "提醒成員：預約總理大臣時段、存情報任務、清點存的道具（網站會跳出 KvK 檢查清單）。" },
    { due: 5, en: "Castle Battle on the last day: agree rally leaders and times.", zh: "最後一天王城爭奪戰：決定集結隊長和時間。" },
  ],
};
const DAY = 86400000;
const LS = "nxs-events-v1";
const store = (() => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch (e) { return {}; } })();
const save = () => { try { localStorage.setItem(LS, JSON.stringify(store)); } catch (e) {} };
let lang = store.lang || "en";
let SCHED = null, weekStart = null;

const $ = (id) => document.getElementById(id);
const tr = (k, v = {}) => { const s = (T[lang] && T[lang][k]) ?? T.en[k] ?? k; return typeof s === "string" ? s.replace(/\{(\w+)\}/g, (m, x) => v[x] ?? m) : s; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const utcDay = (t) => Math.floor(t / DAY) * DAY;
const fmt = (t) => { const d = new Date(t); return `${d.getUTCMonth() + 1}/${d.getUTCDate()}（${tr("wd")[(d.getUTCDay() + 6) % 7]}）`.replace("（", lang === "zh" ? "（" : " (").replace("）", lang === "zh" ? "）" : ")"); };
const evName = (k) => { const e = EVENTS[k]; return e ? `${e.emoji} ${e[lang] || e.en}` : k; };
function mondayOf(t) { const d = utcDay(t); const wd = (new Date(d).getUTCDay() + 6) % 7; return d - wd * DAY; }

// every run of each event that touches [from, to)
function runs(from, to) {
  const out = [];
  for (const [k, s] of Object.entries(SCHED)) {
    let n = Math.floor((from - s.anchor) / DAY / s.periodDays) - 1;
    for (;; n++) {
      const st = s.anchor + n * s.periodDays * DAY; if (st < s.anchor) continue;
      if (st >= to) break;
      const en = st + s.activeDays * DAY;
      if (en > from) out.push({ k, st, en, days: s.activeDays });
    }
  }
  return out.sort((a, b) => a.st - b.st);
}

function render() {
  const ws = weekStart, we = ws + 7 * DAY, today = utcDay(Date.now());
  $("weekLbl").textContent = tr("week", { a: fmt(ws), b: fmt(we - DAY) });
  // days
  const rs = runs(ws, we);
  let html = "";
  for (let i = 0; i < 7; i++) {
    const d = ws + i * DAY;
    const on = rs.filter((r) => r.st <= d && d < r.en);
    html += `<div class="day${d === today ? " today" : ""}"><div class="dname">${esc(tr("wd")[i])}<small>${new Date(d).getUTCMonth() + 1}/${new Date(d).getUTCDate()}</small></div><div>${
      on.length ? on.map((r) => { const n = (d - r.st) / DAY + 1;
        return `<span class="ev${n === 1 ? " start" : ""}">${esc(evName(r.k))} <span class="n">${n === 1 ? esc(tr("starts")) : n === r.days ? esc(tr("ends")) : esc(tr("day", { n, t: r.days }))}</span></span>`; }).join("")
      : `<span class="none">${esc(tr("none"))}</span>`}</div></div>`;
  }
  $("days").innerHTML = html;
  // action items: for events that start this week (even if the prep is due a bit earlier),
  // plus prep that is due this week for events starting next week
  const items = [];
  for (const r of runs(ws, we + 7 * DAY)) for (const [i, td] of (TODO[r.k] || []).entries()) {
    const due = r.st + td.due * DAY;
    const startsThisWeek = r.st >= ws && r.st < we, dueThisWeek = due >= ws && due < we;
    if (startsThisWeek || dueThisWeek) items.push({ r, td, due, id: `${r.k}-${new Date(r.st).toISOString().slice(0, 10)}-${i}` });
  }
  items.sort((a, b) => a.due - b.due);
  store.done = store.done || {};
  $("todos").innerHTML = items.length ? items.map(({ r, td, due, id }) => `
    <label class="todo${store.done[id] ? " done" : ""}">
      <input type="checkbox" data-id="${esc(id)}" ${store.done[id] ? "checked" : ""}>
      <div>
        <div class="txt"><b>${esc(evName(r.k))}</b> — ${esc(td[lang] || td.en)}</div>
        <div class="when">⏰ ${esc(fmt(due))}${due < today && !store.done[id] ? ` <b class="warn">${esc(tr("late"))}</b>` : ""} · ${esc(tr("runs", { a: fmt(r.st), b: fmt(r.en - DAY), n: r.days }))}</div>
        <div class="acts">${td.post ? `<a class="btn small" href="post-k4m8q2.html">${esc(tr("toPost"))}</a>` : ""}${td.ranking ? `<a class="btn small" href="roster-x7k2p9.html">${esc(tr("toRanking"))}</a>` : ""}${EVENTS[r.k] && EVENTS[r.k].noGuide ? "" : `<a class="btn small" href="./#/${lang === "zh" ? "zh" : "en"}/${esc(r.k)}">${esc(tr("toGuide"))}</a>`}</div>
      </div>
    </label>`).join("") : `<div class="none">${esc(tr("noTodo"))}</div>`;
  $("todos").querySelectorAll("input[type=checkbox]").forEach((cb) => cb.onchange = () => {
    if (cb.checked) store.done[cb.dataset.id] = 1; else delete store.done[cb.dataset.id];
    save(); cb.closest(".todo").classList.toggle("done", cb.checked);
  });
}

function applyTexts() {
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = tr(el.dataset.t); });
  $("langBtn").textContent = lang === "zh" ? "English" : "中文";
}
$("langBtn").onclick = () => { lang = lang === "zh" ? "en" : "zh"; store.lang = lang; save(); applyTexts(); if (SCHED) render(); };
$("prevW").onclick = () => { weekStart -= 7 * DAY; render(); };
$("nextW").onclick = () => { weekStart += 7 * DAY; render(); };
$("thisW").onclick = () => { weekStart = defaultWeek(); render(); };
// On Sunday, open on next week (that's when the weekly planning happens)
function defaultWeek() { const now = Date.now(); const m = mondayOf(now); return new Date(utcDay(now)).getUTCDay() === 0 ? m + 7 * DAY : m; }

async function init() {
  applyTexts();
  try {
    const src = await fetch("js/app.js?t=" + Date.now(), { cache: "no-store" }).then((r) => r.text());
    const m = src.match(/const EVENT_SCHEDULES = (\{[\s\S]*?\n\});/);
    SCHED = m ? Function('"use strict";return (' + m[1] + ");")() : null;
  } catch (e) { SCHED = null; }
  if (!SCHED) { $("noData").hidden = false; $("noData").textContent = tr("noData"); return; }
  $("app").hidden = false;
  weekStart = defaultWeek(); render();
}

/* ===== officer password (shared with the other tabs: same password, same saved login) ===== */
const OFFICER_LS = "nxs-post-v1";
const b64dec_ = (b64) => Uint8Array.from(atob(b64.replace(/\s/g, "")), (c) => c.charCodeAt(0));
async function officerCheck(pw, blob) {
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64dec_(blob.salt), iterations: blob.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64dec_(blob.iv) }, key, b64dec_(blob.data));
    return true;
  } catch (e) { return false; }
}
function officerStore() { try { return JSON.parse(localStorage.getItem(OFFICER_LS)) || {}; } catch (e) { return {}; } }
async function officerGate(onOk) {
  let blob = null;
  try { const r = await fetch("data/post-key.json?t=" + Date.now(), { cache: "no-store" }); blob = r.ok ? await r.json() : null; } catch (e) {}
  if (!blob) return onOk();
  const st = officerStore();
  if (st.pw && (await officerCheck(st.pw, blob))) return onOk();
  $("gate").hidden = false;
  const go = async () => {
    const pw = $("gatePw").value;
    if (await officerCheck(pw, blob)) {
      if ($("gateRemember").checked) { const s = officerStore(); s.pw = pw; try { localStorage.setItem(OFFICER_LS, JSON.stringify(s)); } catch (e) {} }
      $("gate").hidden = true; onOk();
    } else { $("gateErr").hidden = false; $("gatePw").value = ""; $("gatePw").focus(); }
  };
  $("gateBtn").onclick = go;
  $("gatePw").onkeydown = (e) => { if (e.key === "Enter") go(); };
  $("gatePw").focus();
}
try { const th = localStorage.getItem("ks-theme"); if (th === "light" || th === "dark") document.documentElement.setAttribute("data-theme", th); } catch (e) {}
officerGate(init);
</script>
</body>
</html>
